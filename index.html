<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triết Lab — Ôn tập Triết học Mác–Lênin</title><style>
*{box-sizing:border-box} :root{color-scheme:light;--bg:#f4f5f1;--card:#fff;--soft:#edf1ed;--fg:#172721;--muted:#67776e;--line:#dce3dd;--accent:#17664c;--accent2:#d8f3b5;--on:#fff;--good:#18774d;--goodbg:#e1f4e8;--bad:#bc4350;--badbg:#fbe8e9;--shadow:0 8px 28px #20362709} [data-theme=dark]{color-scheme:dark;--bg:#131a17;--card:#1d2823;--soft:#27352d;--fg:#e9f1e9;--muted:#a4b4a9;--line:#34473c;--accent:#b5e58e;--accent2:#c7ef9d;--on:#172b1c;--good:#a0e7b7;--goodbg:#234434;--bad:#ffa2a8;--badbg:#472b30;--shadow:0 8px 28px #0002} body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif} button,select{font:inherit;color:inherit} button{cursor:pointer} button:focus-visible,select:focus-visible{outline:3px solid #62a888;outline-offset:3px} button:disabled{cursor:default;opacity:.55} .wrap{max-width:1140px;margin:auto;padding:0 24px} header{border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:10} .top{height:70px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:19px;letter-spacing:-.6px}.brand small{display:block;font-size:10px;font-weight:650;letter-spacing:2px;color:var(--muted);line-height:1.2}.logo{width:39px;height:39px;background:var(--accent);color:var(--on);border-radius:12px;display:grid;place-items:center;font-size:25px}.subtle,.primary,.ghost{border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:var(--card);font-weight:650}.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}.ghost{background:transparent}.subtle:hover,.ghost:hover,.tile:hover{border-color:var(--accent)}.hero{margin:28px 0 22px;position:relative;overflow:hidden;background:#193f32;color:#f5fff0;border-radius:24px;padding:36px;display:grid;grid-template-columns:1fr 210px;gap:20px;align-items:center}.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 8%,#bfe99929,transparent 46%);pointer-events:none}.eyebrow{font-size:11px;font-weight:750;letter-spacing:2.3px;text-transform:uppercase}.hero .eyebrow{color:#c8eeaa}.hero h1{font-size:clamp(32px,5vw,49px);line-height:1.12;letter-spacing:-2px;margin:14px 0}.hero p{max-width:520px;color:#d3e7d9;margin:0}.art{position:relative;height:156px;display:grid;place-items:center}.art svg{width:190px;height:156px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}.stat{border:1px solid var(--line);border-radius:16px;padding:15px 20px;background:var(--card);box-shadow:var(--shadow)}.stat b{display:block;font-size:28px;line-height:1.2;letter-spacing:-1px}.stat span,.muted{color:var(--muted);font-size:13px}.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;gap:10px}.section-title h2{font-size:19px;letter-spacing:-.4px;margin:0}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tiles.four{grid-template-columns:repeat(4,1fr)}.tile{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:7px;padding:18px;min-width:0;transition:transform .16s,border .16s}.tile:hover{transform:translateY(-3px)}.tile .number{font-size:34px;font-weight:850;letter-spacing:-1.6px;line-height:1;color:var(--accent)}.tile .tag{width:34px;height:34px;background:var(--soft);color:var(--accent);border-radius:9px;display:grid;place-items:center;font-weight:800}.tile strong{font-size:15px;line-height:1.35}.tile span:last-child{color:var(--muted);font-size:12px}.tile .arrow{margin-top:auto;color:var(--accent);font-weight:800}.notice{margin:26px 0;font-size:12px;color:var(--muted);padding:15px 18px;border-left:3px solid var(--line)}.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);padding:16px;border-radius:15px;margin-bottom:14px}.quiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;margin:24px 0}.panel{border:1px solid var(--line);background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:24px}.sidebar{align-self:start;position:sticky;top:88px}.bar{height:7px;background:var(--soft);border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}.quiz-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}.question{font-size:clamp(19px,2.6vw,26px);line-height:1.45;letter-spacing:-.35px;margin:19px 0}.pill{display:inline-block;background:var(--soft);border-radius:100px;padding:5px 11px;font-size:11px;font-weight:700;color:var(--muted);margin:14px 4px 0 0}.options{display:grid;gap:10px}.option{display:flex;align-items:center;gap:13px;text-align:left;padding:14px;border:1px solid var(--line);background:var(--card);border-radius:13px;width:100%;font-weight:550;min-height:62px;line-height:1.5}.option:not(:disabled):hover{border-color:var(--accent);background:var(--soft)}.option:disabled{opacity:1}.option .letter{flex:0 0 32px;height:32px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--muted)}.option .ot{flex:1}.option.correct{border-color:var(--good);background:var(--goodbg);color:var(--good)}.option.incorrect{border-color:var(--bad);background:var(--badbg);color:var(--bad)}.option.correct .letter,.option.incorrect .letter{background:var(--card);color:inherit}.feedback{margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:17px 19px;background:var(--soft);animation:pop .2s ease-out}.feedback.good{border-color:var(--good)}.feedback.bad{border-color:var(--bad)}.feedback h3{margin:0 0 7px;font-size:17px}.feedback p{margin:8px 0}.feedback .source{font-size:12px;color:var(--muted)}.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px}.side-head{display:flex;justify-content:space-between;align-items:center}.side-head h3{margin:0;font-size:16px}.score-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.score-row div{background:var(--soft);padding:10px 4px;text-align:center;border-radius:10px;font-size:12px;color:var(--muted)}.score-row b{font-size:21px;display:block;color:var(--fg)}.score-row .green{color:var(--good)}.score-row .red{color:var(--bad)}.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:330px;overflow:auto;padding:3px}.num{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:12px;font-weight:650;padding:0}.num.good{color:var(--good);background:var(--goodbg);border-color:transparent}.num.bad{color:var(--bad);background:var(--badbg);border-color:transparent}.num.current{outline:2px solid var(--accent);outline-offset:0}.legend{font-size:11px;color:var(--muted);margin:12px 0 0}.result{max-width:730px;margin:36px auto}.result .big{font-size:70px;font-weight:900;letter-spacing:-4px;line-height:1;color:var(--accent)}.result h1{letter-spacing:-1px;font-size:32px;margin:10px 0}.result-top{text-align:center;padding:20px 10px}.review-item{border-top:1px solid var(--line);padding:14px 0}.review-item summary{cursor:pointer;font-weight:650}.review-item p{margin:8px 0}.review-item .wrong{color:var(--bad)}.review-item .right{color:var(--good)}.key{font-size:11px;color:var(--muted);margin-top:14px}footer{text-align:center;color:var(--muted);padding:24px;font-size:12px}@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:800px){.wrap{padding:0 15px}.hero{padding:25px;grid-template-columns:1fr 110px}.art{height:110px}.art svg{width:125px}.tiles.four{grid-template-columns:repeat(2,1fr)}.quiz-layout{grid-template-columns:1fr}.sidebar{position:static}.nums{grid-template-columns:repeat(10,1fr);max-height:190px}.panel{padding:18px}}@media(max-width:480px){.hero{grid-template-columns:1fr;padding:23px}.art{display:none}.stats{gap:7px}.stat{padding:12px}.stat b{font-size:23px}.stat span{font-size:11px}.tiles{gap:8px}.tile{padding:13px}.tile .number{font-size:27px}.tile strong{font-size:13px}.top{height:60px}.brand small{display:none}.subtle{padding:8px 11px}.nums{grid-template-columns:repeat(8,1fr)}.quiz-meta{font-size:11px}.question{font-size:20px}.foot button{padding:9px 12px}.key{display:none}}
</style></head><body><header><div class="wrap top"><div class="brand"><div class="logo">φ</div><div>Triết Lab<small>STUDY SPACE / 01</small></div></div><div style="display:flex;gap:8px"><button class="ghost" id="homeBtn" hidden>⌂ Trang chủ</button><button class="subtle" id="themeBtn" aria-label="Đổi giao diện">☾ Tối</button></div></div></header><main class="wrap" id="app"></main><footer>TRIẾT LAB · Không gian ôn tập cá nhân · Chạy offline</footer><script>
const bank=[{"id": 1, "q": "Những phát minh của khoa học tự nhiên nửa đầu thế kỷ 19 đã đem lại cơ sở khoa học cho sự phát triển điều gì?", "letter": "D", "a": "Sự phát triển tư duy biện chứng, giúp nó thoát khỏi tính tự phát và cởi bỏ lớp vỏ thần bí duy tâm.", "e": "Các phát minh khoa học tự nhiên thế kỷ XIX cho thấy giới tự nhiên tồn tại trong sự liên hệ, vận động và phát triển. Chúng tạo tiền đề khoa học để tư duy biện chứng vượt khỏi tính tự phát và lớp vỏ duy tâm, thần bí.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Tư duy siêu hình, tách rời các sự vật", "Thuyết duy tâm thần bí", "Quan niệm thế giới bất biến"]}, {"id": 2, "q": "Ngày nay, triết học có còn được coi là “khoa học của các khoa học” không?", "letter": "D", "a": "Không.", "e": "Ngày nay các khoa học cụ thể có đối tượng và phương pháp nghiên cứu riêng. Triết học không đứng trên hay bao trùm để thay thế các khoa học, mà nghiên cứu những vấn đề và quy luật chung nhất, cung cấp thế giới quan và phương pháp luận.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Có, triết học thay thế mọi khoa học cụ thể", "Chỉ trong nghiên cứu tự nhiên", "Chỉ trong nghiên cứu xã hội"]}, {"id": 3, "q": "Vấn đề cơ bản của triết học là gì?", "letter": "B", "a": "Vấn đề mối quan hệ giữa vật chất và ý thức.", "e": "Vấn đề cơ bản của triết học là mối quan hệ giữa vật chất và ý thức (hay tồn tại và tư duy). Từ cách giải quyết quan hệ này hình thành các lập trường triết học cơ bản.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Mối quan hệ giữa cá nhân và xã hội", "Mối quan hệ giữa tự nhiên và xã hội", "Mối quan hệ giữa lý luận và thực tiễn"]}, {"id": 4, "q": "Khi giải quyết vấn đề cơ bản của triết học cần trả lời câu hỏi nào?", "letter": "B", "a": "Vật chất hay ý thức cái nào có trước, cái nào có sau, cái nào quyết định cái nào? Con người có khả năng nhận thức thế giới được hay không?", "e": "Vấn đề cơ bản của triết học có hai mặt: vật chất hay ý thức cái nào có trước, cái nào quyết định; và con người có khả năng nhận thức thế giới hay không. Phương án B nêu đủ cả hai mặt.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Chỉ cần xác định vật chất hay ý thức có trước", "Chỉ cần xác định con người có thể nhận thức hay không", "Cần xác định các hình thức của hoạt động sản xuất"]}, {"id": 5, "q": "Theo triết học Mác-Lênin, nhận thức đối tượng ở trạng thái cô lập và tĩnh tại là đặc trưng của phương pháp nhận thức nào:", "letter": "B", "a": "Phương pháp siêu hình", "e": "Phương pháp siêu hình xem sự vật trong trạng thái cô lập, tách rời và tương đối tĩnh tại. Phương pháp biện chứng thì xem sự vật trong mối liên hệ, vận động và phát triển.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Phương pháp biện chứng", "Phương pháp lịch sử - cụ thể", "Phương pháp tiếp cận toàn diện"]}, {"id": 6, "q": "Theo quan điểm triết học mácxít, xét ở phương diện nhận thức, triết học ra đời trong điều kiện nào?", "letter": "C", "a": "Tư duy của con người đạt trình độ khái quát cao và xuất hiện tầng lớp trí thức.", "e": "Xét về nguồn gốc nhận thức, triết học chỉ có thể ra đời khi tư duy đạt trình độ khái quát, trừu tượng cao và xuất hiện tầng lớp lao động trí óc có khả năng hệ thống hóa tri thức.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Tư duy mới dừng ở cảm giác trực tiếp", "Con người chưa có khả năng trừu tượng hóa", "Tri thức chỉ tồn tại dưới dạng kinh nghiệm riêng lẻ"]}, {"id": 7, "q": "Những phát minh của khoa học tự nhiên nửa đầu thế kỷ 19 đã đem lại cơ sở khoa học cho sự phát triển (SPT) điều gì?", "letter": "D", "a": "SPT tư duy biện chứng, giúp nó thoát khỏi tính tự phát và cởi bỏ lớp vỏ thần bí duy tâm.", "e": "Các thành tựu khoa học tự nhiên củng cố cách nhìn thế giới trong liên hệ và phát triển, tạo cơ sở để tư duy biện chứng trở nên tự giác và thoát dần khỏi cách giải thích duy tâm, thần bí.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Tư duy siêu hình, tách rời các sự vật", "Thuyết duy tâm thần bí", "Quan niệm thế giới bất biến"]}, {"id": 8, "q": "Bổ sung để được một câu đúng: “Triết học Mác – Lênin là khoa học . . .”.", "letter": "B", "a": "Nghiên cứu quy luật chung nhất của thế giới.", "e": "Triết học Mác - Lênin nghiên cứu các quy luật vận động và phát triển chung nhất của tự nhiên, xã hội và tư duy. Trong các lựa chọn, phương án B diễn đạt đúng nhất phạm vi 'quy luật chung nhất'.", "topic": 0, "type": "Điền khuyết", "wrong": ["Nghiên cứu riêng các quy luật vật lý", "Nghiên cứu riêng các quy luật kinh tế", "Thay thế tất cả khoa học chuyên ngành"]}, {"id": 9, "q": "Vấn đề cơ bản của triết học là gì?", "letter": "B", "a": "Vấn đề mối quan hệ giữa vật chất và ý thức.", "e": "Vấn đề cơ bản của triết học là quan hệ giữa vật chất và ý thức. Đây là vấn đề nền tảng dùng để phân biệt các lập trường triết học chủ yếu.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Mối quan hệ giữa cá nhân và xã hội", "Mối quan hệ giữa tự nhiên và xã hội", "Mối quan hệ giữa lý luận và thực tiễn"]}, {"id": 10, "q": "Theo chủ nghĩa Mác – Lênin, vấn đề cơ bản của triết học là:", "letter": "C", "a": "Mối quan hệ giữa tư duy và tồn tại", "e": "'Tư duy và tồn tại' là cách diễn đạt tương ứng với 'ý thức và vật chất'. Vì vậy phương án C nêu đúng vấn đề cơ bản của triết học.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Mối quan hệ giữa cá nhân và tập thể", "Mối quan hệ giữa kinh tế và chính trị", "Mối quan hệ giữa giai cấp và nhà nước"]}, {"id": 11, "q": "Theo chủ nghĩa Mác – Lênin, câu hỏi lớn thứ hai trong vấn đề cơ bản của triết học là:", "letter": "B", "a": "“Con người có thể nhận thức được thế giới hay không?”", "e": "Mặt thứ hai của vấn đề cơ bản của triết học hỏi về khả năng nhận thức thế giới của con người. Từ đó phân biệt khuynh hướng khả tri và bất khả tri.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Vật chất hay ý thức có trước?", "Xã hội phát triển theo những hình thức nào?", "Lao động có vai trò gì trong sản xuất?"]}, {"id": 12, "q": "Khi giải quyết mặt thứ nhất trong vấn đề cơ bản của triết học, những triết gia cho rằng vật chất có trước ý thức, vật chất quyết định ý thức, thì thuộc trường phái triết học nào:", "letter": "A", "a": "Chủ nghĩa duy vật", "e": "Khẳng định vật chất có trước, ý thức có sau và vật chất quyết định ý thức là lập trường của chủ nghĩa duy vật.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Chủ nghĩa duy tâm chủ quan", "Chủ nghĩa duy tâm khách quan", "Thuyết nhị nguyên"]}, {"id": 13, "q": "Các phạm trù: vật chất, ý thức, vận động, bản chất, hiện tượng là những phạm trù của khoa học nào:", "letter": "A", "a": "Triết học", "e": "Vật chất, ý thức, vận động, bản chất, hiện tượng là những phạm trù có mức độ khái quát rất cao, thuộc hệ thống phạm trù của triết học.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Sinh học", "Kinh tế học", "Tâm lý học thực nghiệm"]}, {"id": 14, "q": "Mối quan hệ giữa triết học duy vật biện chứng (THDVBC) và khoa học tự nhiên (KHTN) biểu hiện ở chỗ nào?", "letter": "B", "a": "Phát minh của KHTN là cơ sở khoa học của các luận điểm THDVBC, còn THDVBC là cơ sở thế giới quan và phương pháp luận chung cho KHTN.", "e": "Khoa học tự nhiên cung cấp dữ liệu và tiền đề khoa học cho triết học duy vật biện chứng; ngược lại, triết học duy vật biện chứng cung cấp thế giới quan và phương pháp luận chung cho hoạt động khoa học.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["THDVBC thay thế mọi phương pháp của KHTN", "KHTN hoàn toàn không liên hệ với THDVBC", "THDVBC quyết định kết quả mọi thí nghiệm KHTN"]}, {"id": 15, "q": "Thứ tự xuất hiện các hình thức thế giới quan trong lịch sử:", "letter": "A", "a": "Thần thoại - tôn giáo - triết học", "e": "Theo cách trình bày phổ biến trong giáo trình, thế giới quan phát triển lịch sử từ thần thoại, đến tôn giáo, rồi triết học. Triết học xuất hiện khi tư duy lý luận và khả năng khái quát phát triển cao hơn.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Triết học - tôn giáo - thần thoại", "Tôn giáo - triết học - thần thoại", "Thần thoại - triết học - tôn giáo"]}, {"id": 16, "q": "Theo chủ nghĩa Mác – Lênin, vấn đề cơ bản của triết học là:", "letter": "C", "a": "Mối quan hệ giữa tư duy và tồn tại", "e": "Vấn đề cơ bản của triết học được diễn đạt là quan hệ giữa tư duy và tồn tại, tương ứng với quan hệ giữa ý thức và vật chất.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Mối quan hệ giữa cá nhân và tập thể", "Mối quan hệ giữa kinh tế và chính trị", "Mối quan hệ giữa giai cấp và nhà nước"]}, {"id": 17, "q": "Theo chủ nghĩa Mác – Lênin, câu hỏi lớn thứ nhất trong vấn đề cơ bản của triết học là:", "letter": "C", "a": "“Vật chất và ý thức, cái nào có trước, cái nào có sau, cái nào quyết định cái nào?”", "e": "Mặt thứ nhất hỏi cái nào có trước và quyết định: vật chất hay ý thức. Vì vậy phương án C là câu hỏi đúng.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Con người có khả năng nhận thức thế giới không?", "Thực tiễn có những hình thức nào?", "Xã hội có bao nhiêu giai cấp?"]}, {"id": 18, "q": "Theo chủ nghĩa Mác – Lênin, câu hỏi lớn thứ hai trong vấn đề cơ bản của triết học là:", "letter": "B", "a": "“Con người có thể nhận thức được thế giới hay không?”", "e": "Mặt thứ hai hỏi con người có thể nhận thức được thế giới hay không. Đây là cơ sở phân biệt khả tri luận và bất khả tri luận.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Vật chất hay ý thức có trước?", "Xã hội phát triển theo những hình thức nào?", "Lao động có vai trò gì trong sản xuất?"]}, {"id": 19, "q": "Khi giải quyết mặt thứ nhất trong vấn đề cơ bản của triết học, những triết gia cho rằng vật chất có trước ý thức, vật chất quyết định ý thức, thì thuộc trường phái triết học nào:", "letter": "A", "a": "Chủ nghĩa duy vật", "e": "Quan niệm vật chất có trước và quyết định ý thức thuộc chủ nghĩa duy vật; chủ nghĩa duy tâm thì cho rằng ý thức hay tinh thần giữ vai trò có trước, quyết định.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Chủ nghĩa duy tâm chủ quan", "Chủ nghĩa duy tâm khách quan", "Thuyết nhị nguyên"]}, {"id": 20, "q": "Triết học Mác - Lênin có chức năng:", "letter": "D", "a": "Chức năng thế giới quan và phương pháp luận phổ biến.", "e": "Hai chức năng cơ bản của triết học Mác - Lênin là chức năng thế giới quan và chức năng phương pháp luận. Đây là vai trò chung, không phải 'khoa học của các khoa học'.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Chức năng thay thế các khoa học cụ thể", "Chức năng dự báo chính xác mọi sự kiện", "Chức năng chỉ mô tả các hiện tượng riêng lẻ"]}, {"id": 21, "q": "Vai trò của triết học Mác – Lênin trong đời sống xã hội:", "letter": "A", "a": "Là thế giới quan, phương pháp luận khoa học cho con người trong nhận thức và thực tiễn.", "e": "Triết học Mác - Lênin cung cấp thế giới quan và phương pháp luận khoa học cho hoạt động nhận thức và thực tiễn của con người. Vì vậy phương án A đầy đủ hơn B hoặc C riêng lẻ.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Thay thế hoàn toàn tri thức chuyên ngành", "Cung cấp công thức cố định giải quyết mọi tình huống", "Chỉ phục vụ nghiên cứu lý thuyết, không liên hệ thực tiễn"]}, {"id": 22, "q": "Nguồn gốc dẫn đến sự ra đời của triết học:", "letter": "C", "a": "Tư duy của con người đạt trình độ khái quát cao và xuất hiện tầng lớp trí thức", "e": "Triết học ra đời khi tư duy con người đạt trình độ khái quát cao và có tầng lớp trí thức có điều kiện hệ thống hóa tri thức. Đây là điều kiện nhận thức quan trọng cho sự hình thành triết học.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Tư duy mới dừng ở cảm giác trực tiếp", "Con người chưa có khả năng trừu tượng hóa", "Tri thức chỉ tồn tại dưới dạng kinh nghiệm riêng lẻ"]}, {"id": 23, "q": "Theo chủ nghĩa Mác – Lênin, thuật ngữ “Triết học” có thể hiểu là:", "letter": "D", "a": "Là tri thức mang tính lý luận, tính hệ thống và tính chung nhất", "e": "Trong cách hiểu của chủ nghĩa Mác - Lênin, triết học là hệ thống tri thức lý luận có tính hệ thống và tính khái quát chung nhất về thế giới và vị trí con người trong thế giới. 'Yêu mến sự thông thái' chỉ là nghĩa gốc của philosophia ở Hy Lạp.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Tập hợp kinh nghiệm riêng lẻ chưa được khái quát", "Một ngành khoa học chỉ nghiên cứu tâm lý cá nhân", "Hệ thống tri thức chỉ nghiên cứu các hiện tượng vật lý"]}, {"id": 24, "q": "Trong lao động và học tập, tình trạng mò mẫm, tuỳ tiện, dễ bằng lòng với những biện pháp cụ thể nhất thời, đi đến chỗ mất phương hướng, thiếu nhìn xa trông rộng, thiếu chủ động và sáng tạo là biểu hiện của:", "letter": "B", "a": "Sự xem thường triết học.", "e": "Giáo trình cảnh báo rằng xem thường triết học dễ dẫn đến mò mẫm, tùy tiện, chỉ chạy theo biện pháp trước mắt, thiếu định hướng và tầm nhìn. Vì vậy đây là biểu hiện của sự xem thường triết học.", "topic": 0, "type": "Vận dụng / tình huống", "wrong": ["Vận dụng linh hoạt phương pháp luận", "Tôn trọng điều kiện khách quan", "Thống nhất lý luận với thực tiễn"]}, {"id": 25, "q": "Nội dung cơ bản của mối quan hệ biện chứng giữa vật chất và ý thức là:", "letter": "C", "a": "Vật chất có trước, ý thức có sau, vật chất quyết định ý thức, ý thức có thể tác động trở lại vật chất thông qua hoạt động của con người", "e": "Quan hệ biện chứng vật chất - ý thức gồm hai chiều: vật chất có trước và quyết định ý thức; đồng thời ý thức có tính độc lập tương đối và có thể tác động trở lại vật chất thông qua hoạt động thực tiễn của con người.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Ý thức có trước và sinh ra vật chất", "Vật chất và ý thức hoàn toàn độc lập", "Vật chất quyết định ý thức và ý thức không thể tác động trở lại"]}, {"id": 26, "q": "Theo quan niệm triết học Mác – Lênin, tính thống nhất của thế giới là gì:", "letter": "B", "a": "Tính vật chất", "e": "Chủ nghĩa duy vật biện chứng khẳng định thế giới thống nhất ở tính vật chất: các sự vật và hiện tượng dù đa dạng đều là những dạng tồn tại của thế giới vật chất.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Tính tinh thần", "Tính cảm giác", "Tính ý niệm tuyệt đối"]}, {"id": 27, "q": "Nguyên tắc phương pháp luận được rút ra từ mối quan hệ giữa vật chất và ý thức trong triết học Mác – Lênin là:", "letter": "B", "a": "Quan điểm khách quan", "e": "Từ việc vật chất quyết định ý thức, phương pháp luận trước hết yêu cầu phải tôn trọng hiện thực khách quan, xuất phát từ điều kiện khách quan trong nhận thức và hành động. Đó là quan điểm khách quan.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Quan điểm phát triển", "Quan điểm lịch sử - cụ thể", "Quan điểm duy ý chí"]}, {"id": 28, "q": "“Vật chất là một phạm trù triết học dùng để chỉ … được đem lại cho con người trong cảm giác, được cảm giác của chúng ta chép lại, chụp lại, phản ánh và tồn tại không lệ thuộc vào cảm giác”. Điền từ thích hợp vào dấu “…”:", "letter": "B", "a": "Thực tại khách quan", "e": "Định nghĩa kinh điển của V.I. Lênin dùng cụm 'thực tại khách quan' để chỉ cái tồn tại độc lập với cảm giác nhưng được cảm giác phản ánh.", "topic": 1, "type": "Điền khuyết", "wrong": ["Ý niệm tuyệt đối", "Cảm giác chủ quan", "Tri thức kinh nghiệm"]}, {"id": 29, "q": "Thực tại khách quan có thể hiểu là:", "letter": "B", "a": "Tất cả những gì tồn tại thực và tồn tại độc lập với ý thức của con người", "e": "'Thực tại khách quan' là cái tồn tại thực, độc lập với ý thức của con người. Nó không đồng nhất với hình ảnh hay tri thức nằm trong đầu óc con người.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Những gì chỉ tồn tại trong tư duy", "Tất cả hình ảnh do trí tưởng tượng tạo ra", "Những gì phụ thuộc hoàn toàn vào cảm giác"]}, {"id": 30, "q": "Nguyên tắc phương pháp luận được rút ra từ Nguyên lý về sự phát triển trong triết học Mác – Lênin là:", "letter": "D", "a": "Quan điểm phát triển", "e": "Nguyên lý về sự phát triển yêu cầu xem xét sự vật trong vận động, biến đổi và xu hướng đi lên, từ đó rút ra quan điểm phát triển.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Quan điểm tĩnh tại", "Quan điểm phiến diện", "Quan điểm duy ý chí"]}, {"id": 31, "q": "Quy luật nào của phép biện chứng duy vật chỉ ra cách thức phát triển của thế giới vật chất:", "letter": "C", "a": "Quy luật lượng-chất", "e": "Quy luật chuyển hóa từ những thay đổi về lượng thành những thay đổi về chất và ngược lại chỉ ra cách thức phát triển: tích lũy lượng đến điểm nút dẫn tới bước nhảy về chất.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Quy luật mâu thuẫn", "Quy luật phủ định của phủ định", "Quy luật nhân quả"]}, {"id": 32, "q": "Tổng hợp nhưng thuộc tính khách quan vốn có của sự vật, nói lên sự vật là cái gì, phân biệt nó với cái khác. Đó là khái niệm nào:", "letter": "B", "a": "Chất", "e": "'Chất' là tổng hợp những thuộc tính khách quan cơ bản làm cho sự vật là nó và phân biệt nó với sự vật khác.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Lượng", "Độ", "Điểm nút"]}, {"id": 33, "q": "Quan điểm nào sau đây đối lập với chủ nghĩa duy vật biện chứng về sự phát triển:", "letter": "D", "a": "Sự phát triển không diễn ra theo quy luật khách quan", "e": "Chủ nghĩa duy vật biện chứng coi sự phát triển là quá trình có tính khách quan và có quy luật. Vì vậy quan niệm cho rằng phát triển không diễn ra theo quy luật khách quan là đối lập với nó.", "topic": 1, "type": "Tìm đáp án sai / loại trừ", "wrong": ["Sự phát triển có tính khách quan", "Sự phát triển có tính phổ biến", "Sự phát triển có tính đa dạng, phong phú"]}, {"id": 34, "q": "Tính quy định nói lên sự vật là nó chứ không phải cái khác trong một mối quan hệ nhất định, gọi là gì:", "letter": "A", "a": "Chất", "e": "Tính quy định làm cho một sự vật là nó chứ không phải cái khác trong một quan hệ nhất định chính là 'chất' của sự vật.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Lượng", "Độ", "Điểm nút"]}, {"id": 35, "q": "Nguyên tắc phương pháp luận được rút ra từ Nguyên lý về mối liên hệ phổ biến trong triết học Mác – Lênin là:", "letter": "C", "a": "Quan điểm lịch sử - cụ thể", "e": "Nguyên lý về mối liên hệ phổ biến là cơ sở cho quan điểm toàn diện và quan điểm lịch sử - cụ thể. Trong các phương án đã cho, 'quan điểm lịch sử - cụ thể' là đáp án phù hợp.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Quan điểm duy ý chí", "Quan điểm cô lập", "Quan điểm phủ nhận hoàn cảnh lịch sử"]}, {"id": 36, "q": "Nguyên lý cơ bản của phép biện chứng duy vật là nguyên lý nào:", "letter": "C", "a": "Nguyên lý về mối liên hệ phổ biến và về sự phát triển", "e": "Hai nguyên lý cơ bản của phép biện chứng duy vật là nguyên lý về mối liên hệ phổ biến và nguyên lý về sự phát triển.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Nguyên lý về trạng thái bất biến và cô lập", "Nguyên lý về tính duy nhất của ý thức", "Nguyên lý về tất định chủ quan và ngẫu nhiên tuyệt đối"]}, {"id": 37, "q": "Theo quan điểm của chủ nghĩa duy vật biện chứng, mối liên hệ giữa các sự vật có tính chất gì:", "letter": "B", "a": "Tính khách quan, tính phổ biến, tính đa dạng", "e": "Các mối liên hệ tồn tại vốn có trong bản thân sự vật, xuất hiện ở mọi lĩnh vực và có nhiều loại, nhiều hình thức. Vì vậy chúng có tính khách quan, phổ biến và đa dạng.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Tính chủ quan, tính đơn nhất, tính bất biến", "Tính khách quan nhưng chỉ có ở tự nhiên", "Tính ngẫu nhiên và phụ thuộc hoàn toàn vào ý thức"]}, {"id": 38, "q": "Cơ sở lý luận của quan điểm toàn diện là nguyên lý nào:", "letter": "B", "a": "Nguyên lý về mối liên hệ phổ biến", "e": "Quan điểm toàn diện yêu cầu xem xét sự vật trong hệ thống các mối liên hệ của nó. Cơ sở lý luận trực tiếp của yêu cầu này là nguyên lý về mối liên hệ phổ biến.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Nguyên lý về sự phát triển", "Quy luật lượng - chất", "Quy luật phủ định của phủ định"]}, {"id": 39, "q": "Quan điểm toàn diện, quan điểm lịch sử-cụ thể và quan điểm phát triển được rút ra từ:", "letter": "B", "a": "Hai nguyên lý cơ bản của phép biện chứng duy vật", "e": "Quan điểm toàn diện và lịch sử - cụ thể gắn với nguyên lý về mối liên hệ phổ biến; quan điểm phát triển gắn với nguyên lý về sự phát triển. Vì vậy cả ba được rút ra từ hai nguyên lý cơ bản của phép biện chứng duy vật.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Chỉ quy luật lượng - chất", "Chỉ quy luật mâu thuẫn", "Chỉ lý luận về nhận thức cảm tính"]}, {"id": 40, "q": "Quy luật nào của phép biện chứng duy vật chỉ ra nguyên nhân, động lực phát triển của thế giới vật chất:", "letter": "D", "a": "Quy luật mâu thuẫn", "e": "Quy luật thống nhất và đấu tranh của các mặt đối lập (quy luật mâu thuẫn) chỉ ra nguồn gốc và động lực bên trong của sự vận động, phát triển.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Quy luật lượng - chất", "Quy luật phủ định của phủ định", "Quy luật nhân quả"]}, {"id": 41, "q": "Quy luật nào không phải là một trong các quy luật cơ bản của Phép biện chứng duy vật:", "letter": "B", "a": "Quy luật nhân quả", "e": "Ba quy luật cơ bản của phép biện chứng duy vật là lượng - chất, thống nhất và đấu tranh của các mặt đối lập, và phủ định của phủ định. Nhân quả là một cặp phạm trù, không phải một trong ba quy luật cơ bản.", "topic": 1, "type": "Tìm đáp án sai / loại trừ", "wrong": ["Quy luật lượng - chất", "Quy luật mâu thuẫn", "Quy luật phủ định của phủ định"]}, {"id": 42, "q": "Hai mặt đối lập ràng buộc nhau, tạo tiền đề tồn tại cho nhau, triết học gọi là:", "letter": "B", "a": "Sự thống nhất của hai mặt đối lập", "e": "Khi hai mặt đối lập nương tựa, ràng buộc và làm tiền đề tồn tại cho nhau, đó là sự thống nhất của các mặt đối lập.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Sự đấu tranh của hai mặt đối lập", "Sự chuyển hóa của hai mặt đối lập", "Sự tương đồng của các mặt đối lập"]}, {"id": 43, "q": "Luận điểm sau đây thuộc trường phái triết học nào: “Sự thống nhất của các mặt đối lập loại trừ sự đấu tranh của các mặt đối lập”.", "letter": "A", "a": "Chủ nghĩa duy vật siêu hình", "e": "Quan niệm cho rằng sự thống nhất loại trừ đấu tranh tách rời hai mặt vốn vừa thống nhất vừa đấu tranh. Đây là cách nhìn siêu hình, không phải biện chứng.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Chủ nghĩa duy vật biện chứng", "Chủ nghĩa duy tâm chủ quan", "Chủ nghĩa duy tâm khách quan"]}, {"id": 44, "q": "Trong hoạt động thực tiễn, sai lầm của trì trệ bảo thủ là do không tôn trọng quy luật nào của phép biện chứng duy vật:", "letter": "A", "a": "Quy luật lượng – chất", "e": "Trì trệ, bảo thủ thường xuất phát từ việc không nhận ra sự tích lũy về lượng đã tới giới hạn cần có bước nhảy về chất. Vì vậy nó vi phạm quy luật lượng - chất.", "topic": 1, "type": "Vận dụng / tình huống", "wrong": ["Quy luật mâu thuẫn", "Quy luật phủ định của phủ định", "Quy luật nhân quả"]}, {"id": 45, "q": "Trong hoạt động thực tiễn, sai lầm của việc không kế thừa những yếu tố tích cực, tiến bộ của cái cũ là do không tôn trọng quy luật nào của phép biện chứng duy vật:", "letter": "B", "a": "Quy luật phủ định của phủ định", "e": "Quy luật phủ định của phủ định khẳng định sự phát triển không phải xóa sạch cái cũ mà có tính kế thừa, giữ lại những yếu tố tích cực trong hình thức mới.", "topic": 1, "type": "Vận dụng / tình huống", "wrong": ["Quy luật lượng - chất", "Quy luật mâu thuẫn", "Quy luật nhân quả"]}, {"id": 46, "q": "Trong hoạt động thực tiễn, sai lầm của việc không tạo điều kiện cho cái mới tích cực phát triển là do không tôn trọng quy luật nào của phép biện chứng duy vật:", "letter": "B", "a": "Quy luật phủ định của phủ định", "e": "Quy luật phủ định của phủ định thể hiện xu hướng cái mới ra đời, khắc phục cái cũ nhưng có kế thừa. Không tạo điều kiện cho cái mới tích cực phát triển là không tôn trọng xu hướng đó.", "topic": 1, "type": "Vận dụng / tình huống", "wrong": ["Quy luật lượng - chất", "Quy luật mâu thuẫn", "Quy luật nhân quả"]}, {"id": 47, "q": "Hai mặt đối lập ràng buộc nhau, tạo tiền đề tồn tại cho nhau, triết học gọi là:", "letter": "B", "a": "Sự thống nhất của hai mặt đối lập.", "e": "Hai mặt đối lập ràng buộc, quy định và làm tiền đề tồn tại cho nhau được gọi là sự thống nhất của các mặt đối lập.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Sự đấu tranh của hai mặt đối lập", "Sự chuyển hóa của hai mặt đối lập", "Sự tương đồng của các mặt đối lập"]}, {"id": 48, "q": "Hai mặt đối lập còn tồn tại những yếu tố giống nhau, triết học gọi là:", "letter": "D", "a": "Sự tương đồng của các mặt đối lập.", "e": "Ngoài sự đối lập, các mặt đối lập có thể còn những yếu tố giống nhau. Khía cạnh này được gọi là sự tương đồng của các mặt đối lập.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Sự đấu tranh của các mặt đối lập", "Sự chuyển hóa của các mặt đối lập", "Sự loại trừ của các mặt đối lập"]}, {"id": 49, "q": "Theo quan điểm của chủ nghĩa duy vật biện chứng, quá trình hình thành ý thức là quá trình nào?", "letter": "D", "a": "Hoạt động chủ động cải tạo thế giới và phản ánh sáng tạo thế giới", "e": "Ý thức không phải sự sao chép thụ động. Nó hình thành trong hoạt động thực tiễn của con người, là quá trình phản ánh chủ động và sáng tạo thế giới khách quan gắn với hoạt động cải tạo thế giới.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Sao chép thụ động thế giới mà không qua hoạt động", "Quá trình ý thức tự sinh ra thế giới", "Quá trình tiếp nhận ý niệm có sẵn một cách độc lập"]}, {"id": 50, "q": "Thực tiễn đóng vai trò gì với nhận thức:", "letter": "C", "a": "Cơ sở, động lực, mục đích", "e": "Thực tiễn là cơ sở, động lực và mục đích của nhận thức; đồng thời còn là tiêu chuẩn kiểm tra chân lý. Trong các lựa chọn, phương án C nêu đúng các vai trò cốt lõi nhất có trong đáp án.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Chỉ là kết quả của nhận thức", "Chỉ là một hoạt động tinh thần", "Không có quan hệ với nhận thức"]}, {"id": 51, "q": "Nguyên tắc phương pháp luận được rút ra từ Quan hệ biện chứng giữa nhận thức và thực tiễn trong triết học Mác – Lênin là:", "letter": "A", "a": "Quan điểm thống nhất lý luận với thực tiễn", "e": "Từ quan hệ biện chứng giữa nhận thức và thực tiễn rút ra yêu cầu phải gắn lý luận với thực tiễn, tránh cả lý luận suông lẫn kinh nghiệm chủ nghĩa.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Quan điểm duy ý chí", "Quan điểm kinh nghiệm thuần túy", "Quan điểm tách lý luận khỏi thực tiễn"]}, {"id": 52, "q": "Nhận thức lý tính khác với nhận thức cảm tính ở chỗ:", "letter": "C", "a": "Nhận thức lý tính phản ánh, khái quát, trừu tượng, gián tiếp sự vật, hiện tượng trong tính tất yếu, chỉnh thể toàn diện.", "e": "Nhận thức lý tính phản ánh sự vật một cách khái quát, trừu tượng và gián tiếp, hướng tới những mối liên hệ bản chất, tất yếu và tính chỉnh thể; khác với nhận thức cảm tính mang tính trực tiếp, cụ thể hơn.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Phản ánh trực tiếp bằng giác quan, không khái quát", "Chỉ phản ánh các thuộc tính bề ngoài", "Chỉ tái hiện hình ảnh đã từng cảm nhận"]}, {"id": 53, "q": "Tiêu chuẩn để kiểm tra chân lý là:", "letter": "C", "a": "Thực tiễn", "e": "Theo triết học Mác - Lênin, thực tiễn là tiêu chuẩn khách quan để kiểm nghiệm chân lý vì tri thức phải được kiểm chứng trong hoạt động hiện thực.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Sự đồng thuận của số đông", "Niềm tin chủ quan", "Uy tín của người phát biểu"]}, {"id": 54, "q": "Nhận thức cảm tính bao gồm những hình thức nào:", "letter": "A", "a": "Cảm giác, tri giác, biểu tượng", "e": "Nhận thức cảm tính gồm ba hình thức cơ bản: cảm giác, tri giác và biểu tượng. Khái niệm, phán đoán, suy lý thuộc nhận thức lý tính.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Khái niệm, phán đoán, suy lý", "Cảm giác, phán đoán, suy lý", "Tri giác, khái niệm, phán đoán"]}, {"id": 55, "q": "Đâu không phải là vai trò của thực tiễn đối với nhận thức:", "letter": "C", "a": "Thực tiễn là sự định hướng của nhận thức", "e": "Các vai trò chuẩn của thực tiễn đối với nhận thức gồm: cơ sở, động lực, mục đích và tiêu chuẩn kiểm tra chân lý. 'Sự định hướng của nhận thức' không phải cách liệt kê chuẩn trong giáo trình.", "topic": 2, "type": "Tìm đáp án sai / loại trừ", "wrong": ["Thực tiễn là cơ sở của nhận thức", "Thực tiễn là động lực của nhận thức", "Thực tiễn là tiêu chuẩn kiểm tra chân lý"]}, {"id": 56, "q": "Hình thức liên kết các khái niệm, phản ánh mối liên hệ giữa các sự vật hiện tượng của thế giới trong ý thức con người, là hình thức nào của nhận thức trong các hình thức dưới đây:", "letter": "B", "a": "Phán đoán", "e": "Phán đoán là hình thức tư duy liên kết các khái niệm để khẳng định hoặc phủ định một thuộc tính hay mối liên hệ của sự vật, hiện tượng.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Khái niệm", "Cảm giác", "Biểu tượng"]}, {"id": 57, "q": "Quá trình con người sử dụng ngôn ngữ gọi tên đối tượng và khái quát những đặc trưng về đối tượng, là hình thức nào của nhận thức trong các hình thức dưới đây:", "letter": "C", "a": "Khái niệm", "e": "Khái niệm dùng ngôn ngữ để gọi tên và khái quát những dấu hiệu, thuộc tính bản chất của một lớp sự vật hay hiện tượng.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Phán đoán", "Tri giác", "Suy lý"]}, {"id": 58, "q": "Nguyên tắc thống nhất giữa lý luận với thực tiễn là nguyên tắc được rút ra trực tiếp từ:", "letter": "A", "a": "Lý luận về nhận thức", "e": "Nguyên tắc thống nhất lý luận với thực tiễn là một yêu cầu cơ bản của lý luận nhận thức duy vật biện chứng. Trong các phương án, 'lý luận về nhận thức' là đáp án trực tiếp phù hợp.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Lý luận về hình thái kinh tế - xã hội", "Lý luận về giai cấp", "Lý luận về cơ sở hạ tầng và kiến trúc thượng tầng"]}, {"id": 59, "q": "Cơ sở lý luận của quan điểm thống nhất lý luận và thực tiễn là gì:", "letter": "D", "a": "Lý luận về quan hệ biện chứng giữa nhận thức và thực tiễn", "e": "Cơ sở lý luận trực tiếp của quan điểm thống nhất lý luận và thực tiễn là mối quan hệ biện chứng giữa nhận thức và thực tiễn: thực tiễn quyết định nhận thức, còn nhận thức đúng có thể định hướng hoạt động thực tiễn.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Quy luật lượng - chất", "Nguyên lý về sự phát triển", "Lý luận về quan hệ sản xuất"]}, {"id": 60, "q": "Các nhân tố cơ bản của quá trình sản xuất là:", "letter": "D", "a": "Tư liệu sản xuất và người lao động", "e": "Quá trình sản xuất vật chất cần hai nhân tố cơ bản: tư liệu sản xuất và người lao động. Thiếu một trong hai thì quá trình sản xuất không thể diễn ra.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Cơ sở hạ tầng và kiến trúc thượng tầng", "Quan hệ sở hữu và quan hệ phân phối", "Tài nguyên thiên nhiên và ý thức xã hội"]}, {"id": 61, "q": "Lực lượng sản xuất bao gồm các yếu tố:", "letter": "A", "a": "Tư liệu sản xuất và người lao động", "e": "Lực lượng sản xuất gồm người lao động và tư liệu sản xuất (trong đó có tư liệu lao động, công cụ và đối tượng lao động). Vì vậy phương án A là cách khái quát đúng.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Quan hệ sở hữu và phân phối", "Quan hệ sản xuất và nhà nước", "Cơ sở hạ tầng và kiến trúc thượng tầng"]}, {"id": 62, "q": "Lực lượng sản xuất biểu hiện mối quan hệ:", "letter": "C", "a": "Mối quan hệ giữa con người với tự nhiên", "e": "Lực lượng sản xuất biểu hiện năng lực thực tiễn của con người trong quá trình tác động, cải biến giới tự nhiên để tạo ra của cải vật chất. Vì vậy nó phản ánh quan hệ giữa con người với tự nhiên.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Mối quan hệ giữa con người với con người trong sản xuất", "Mối quan hệ giữa kinh tế và chính trị", "Mối quan hệ giữa cá nhân và tập thể"]}, {"id": 63, "q": "Cấu thành quan hệ sản xuất bao gồm các mặt cơ bản là:", "letter": "C", "a": "Quan hệ về sở hữu tư liệu sản xuất; Quan hệ về tổ chức, quản lý quá trình sản xuất; Quan hệ về phân phối sản phẩm", "e": "Quan hệ sản xuất gồm ba mặt cơ bản: quan hệ sở hữu tư liệu sản xuất; quan hệ tổ chức, quản lý quá trình sản xuất; và quan hệ phân phối sản phẩm.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Người lao động, công cụ lao động, đối tượng lao động", "Ý thức chính trị, pháp quyền, đạo đức", "Sản xuất, tiêu dùng và trao đổi ý tưởng"]}, {"id": 64, "q": "Nội dung quy luật quan hệ sản xuất (QHSX) phải phù hợp với trình độ lực lượng sản xuất (LLSX) là:", "letter": "A", "a": "Sự phát triển của LLSX đòi hỏi QHSX phải phù hợp theo; và khi QHSX phù hợp sẽ thúc đẩy LLSX phát triển", "e": "Lực lượng sản xuất là nội dung vật chất năng động, khi phát triển sẽ đòi hỏi quan hệ sản xuất thay đổi cho phù hợp. Khi quan hệ sản xuất phù hợp, nó tạo điều kiện thúc đẩy lực lượng sản xuất phát triển.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["QHSX luôn quyết định LLSX và không chịu tác động ngược", "QHSX và LLSX phát triển hoàn toàn độc lập", "LLSX phải giữ nguyên để phù hợp với QHSX hiện có"]}, {"id": 65, "q": "Cơ sở hạ tầng là:", "letter": "B", "a": "Toàn bộ những quan hệ sản xuất hợp thành cơ cấu kinh tế của xã hội", "e": "Cơ sở hạ tầng trong chủ nghĩa duy vật lịch sử không phải đường sá hay máy móc, mà là toàn bộ các quan hệ sản xuất hợp thành cơ cấu kinh tế của xã hội ở một giai đoạn nhất định.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Toàn bộ đường sá, cầu cống và công trình xây dựng", "Toàn bộ các thiết chế chính trị - xã hội", "Toàn bộ tư liệu sản xuất và người lao động"]}, {"id": 66, "q": "Kiến trúc thượng tầng là:", "letter": "A", "a": "Hệ thống các hình thái ý thức xã hội, cùng với các thiết chế chính trị - xã hội tương ứng, được hình thành trên một cơ sở hạ tầng nhất định", "e": "Kiến trúc thượng tầng là toàn bộ các hình thái ý thức xã hội cùng những thiết chế chính trị - xã hội tương ứng, được xây dựng trên một cơ sở hạ tầng kinh tế nhất định.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Toàn bộ quan hệ sản xuất hợp thành cơ cấu kinh tế", "Tổng thể công cụ và đối tượng lao động", "Hệ thống cơ sở vật chất kỹ thuật của sản xuất"]}, {"id": 67, "q": "Trong mối quan hệ biện chứng giữa cơ sở hạ tầng (CSHT) và kiến trúc thượng tầng (KTTT) thì:", "letter": "A", "a": "CSHT quyết định KTTT", "e": "Cơ sở hạ tầng giữ vai trò quyết định đối với sự hình thành và biến đổi của kiến trúc thượng tầng. Kiến trúc thượng tầng có tính độc lập tương đối và có thể tác động trở lại cơ sở hạ tầng, nhưng phương án hỏi chiều quyết định nên chọn A.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["KTTT luôn quyết định CSHT", "CSHT và KTTT hoàn toàn độc lập", "CSHT chỉ là kết quả thụ động của KTTT"]}, {"id": 68, "q": "Quy luật xã hội giữ vai trò quyết định đối với sự vận động và phát triển của xã hội là:", "letter": "C", "a": "Quy luật về sự phù hợp của quan hệ sản xuất với trình độ phát triển của lực lượng sản xuất", "e": "Quy luật quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất là quy luật cơ bản, giữ vai trò quyết định đối với sự vận động và phát triển của phương thức sản xuất và xã hội.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Quy luật lượng - chất", "Quy luật phân phối theo nhu cầu", "Quy luật cạnh tranh thị trường"]}, {"id": 69, "q": "Nguồn gốc vận động và phát triển của hình thái kinh tế - xã hội là do:", "letter": "B", "a": "Sự phát triển liên tục của lực lượng sản xuất", "e": "Nguồn gốc sâu xa của sự vận động các hình thái kinh tế - xã hội nằm ở sự phát triển liên tục của lực lượng sản xuất. Sự phát triển đó làm nảy sinh yêu cầu biến đổi quan hệ sản xuất và các mặt xã hội liên quan.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Sự phát triển tự phát của tư tưởng tách khỏi sản xuất", "Ý muốn chủ quan của một cá nhân", "Sự bất biến của quan hệ sản xuất"]}, {"id": 70, "q": "Nguyên nhân dẫn đến sự xuất hiện giai cấp là do:", "letter": "B", "a": "Phân công lao động xã hội và xuất hiện chế độ tư hữu", "e": "Sự phân công lao động xã hội cùng với sự xuất hiện chế độ tư hữu tạo điều kiện hình thành những tập đoàn người có địa vị khác nhau đối với tư liệu sản xuất, từ đó xuất hiện giai cấp.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Sự khác nhau về sở thích cá nhân", "Sự khác nhau về khí hậu", "Sự phân chia nhóm theo tuổi tác"]}, {"id": 71, "q": "Để xoá bỏ giai cấp trước hết phải xoá bỏ chế độ:", "letter": "D", "a": "Chế độ tư hữu", "e": "Cơ sở kinh tế trực tiếp duy trì sự phân chia giai cấp đối kháng là chế độ tư hữu về tư liệu sản xuất. Vì vậy muốn xóa bỏ giai cấp về căn bản phải xóa bỏ cơ sở tư hữu tạo ra sự đối kháng đó.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Chế độ phân công công việc nói chung", "Chế độ quản lý hành chính", "Chế độ giáo dục phổ thông"]}, {"id": 72, "q": "Nguyên nhân cơ bản gây ra mâu thuẫn đối kháng giữa các giai cấp trong xã hội:", "letter": "B", "a": "Sự đối lập về lợi ích cơ bản – lợi ích kinh tế", "e": "Mâu thuẫn đối kháng giai cấp bắt nguồn từ sự đối lập về lợi ích cơ bản, trước hết là lợi ích kinh tế gắn với địa vị khác nhau trong hệ thống sản xuất xã hội.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Sự khác biệt về sở thích", "Sự khác biệt về ngôn ngữ", "Sự khác biệt về tuổi tác"]}, {"id": 73, "q": "Vai trò của đấu tranh giai cấp trong các xã hội có gia cấp đối kháng:", "letter": "C", "a": "Là động lực tiến bộ lịch sử. Hình thành xã hội mới, tiến bộ hơn", "e": "Trong xã hội có giai cấp đối kháng, đấu tranh giai cấp là một động lực trực tiếp quan trọng của tiến bộ lịch sử, có thể dẫn tới thay đổi chế độ xã hội và hình thành xã hội mới tiến bộ hơn.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Làm cho mọi hình thái xã hội bất biến", "Không có tác động đến tiến trình xã hội", "Chỉ thay đổi nhận thức cá nhân mà không ảnh hưởng xã hội"]}, {"id": 74, "q": "Thực chất của cuộc đấu tranh giai cấp là nhằm giải quyết mâu thuẫn về lợi ích giữa các giai cấp:", "letter": "A", "a": "Giữa giai cấp bóc lột và giai cấp bị bóc lột", "e": "Thực chất của đấu tranh giai cấp là đấu tranh giải quyết mâu thuẫn lợi ích giữa giai cấp bóc lột và giai cấp bị bóc lột, giữa lực lượng áp bức và lực lượng bị áp bức.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Giữa các cá nhân khác biệt về tính cách", "Giữa các nhóm nghề nghiệp có cùng lợi ích cơ bản", "Giữa các thế hệ chỉ vì chênh lệch tuổi tác"]}, {"id": 75, "q": "Theo C.Mác: Trong tính hiện thực của nó, bản chất con người là:", "letter": "D", "a": "Tổng hòa những quan hệ xã hội", "e": "C. Mác nhấn mạnh rằng bản chất con người, trong tính hiện thực của nó, là tổng hòa những quan hệ xã hội. Con người hình thành và phát triển trong mạng lưới các quan hệ lịch sử - xã hội cụ thể.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Tổng hợp các bản năng sinh học", "Một ý niệm tinh thần có sẵn", "Tổng hợp đặc điểm di truyền thuần túy"]}, {"id": 76, "q": "Con người sẽ bộc lộ được bản chất xã hội của mình khi:", "letter": "A", "a": "Khi tồn tại trong các quan hệ xã hội", "e": "Bản chất xã hội của con người chỉ biểu hiện và được hình thành khi con người sống, hoạt động trong các quan hệ xã hội; không thể tách con người khỏi xã hội để giải thích đầy đủ bản chất của họ.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Khi hoàn toàn tách khỏi xã hội", "Chỉ khi thực hiện các chức năng sinh học", "Khi không có bất kỳ hoạt động giao tiếp nào"]}, {"id": 77, "q": "Nguyên nhân trực tiếp làm xuất hiện nhà nước là:", "letter": "B", "a": "Những mâu thuẫn giai cấp không thể điều hòa được", "e": "Theo chủ nghĩa duy vật lịch sử, nhà nước xuất hiện khi xã hội phân hóa giai cấp và mâu thuẫn giai cấp trở nên không thể điều hòa bằng cơ chế cộng đồng cũ.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Sự xuất hiện của ngôn ngữ", "Sự khác biệt về điều kiện tự nhiên", "Sự hình thành các gia đình nói chung"]}, {"id": 78, "q": "Cách mạng xã hội là:", "letter": "C", "a": "Sự thay đổi căn bản về chất, từ hình thái kinh tế - xã hội này, lên hình thái kinh tế - xã hội cao hơn; Là đỉnh cao, điểm nút giải quyết mâu thuẫn, đối kháng giai cấp", "e": "Cách mạng xã hội là sự biến đổi căn bản về chất, tạo bước nhảy từ một hình thái kinh tế - xã hội sang hình thái cao hơn; trong xã hội đối kháng, nó là điểm nút giải quyết những mâu thuẫn cơ bản đã chín muồi.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Sự thay đổi nhỏ trong kỹ thuật sản xuất", "Sự thay đổi cá nhân lãnh đạo mà không đổi chế độ", "Sự điều chỉnh cục bộ không thay đổi chất của xã hội"]}, {"id": 79, "q": "Quy luật xã hội giữ vai trò quyết định đối với sự vận động và phát triển của xã hội là:", "letter": "C", "a": "Quy luật về sự phù hợp của quan hệ sản xuất với trình độ phát triển của lực lượng sản xuất", "e": "Quy luật quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất giữ vai trò cơ bản, quyết định sự vận động và phát triển của đời sống xã hội.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Quy luật lượng - chất", "Quy luật phân phối theo nhu cầu", "Quy luật cạnh tranh thị trường"]}, {"id": 80, "q": "Vai trò của quần chúng nhân dân trong lịch sử:", "letter": "B", "a": "Là chủ thế sáng tạo chân chính ra lịch sử, quyết định sự phát triển của lịch sử", "e": "Quần chúng nhân dân là chủ thể sáng tạo chân chính của lịch sử: họ sản xuất của cải vật chất, sáng tạo giá trị tinh thần và là lực lượng cơ bản của các biến đổi xã hội.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Chỉ tiếp nhận thụ động các quyết định của lãnh tụ", "Không tham gia sáng tạo giá trị tinh thần", "Không có vai trò trong biến đổi xã hội"]}, {"id": 81, "q": "Vai trò cá nhân người lãnh đạo của quần chúng nhân dân là:", "letter": "D", "a": "Có ý nghĩa quyết định trực tiếp đến thành công hay thất bại của các phong trào cách mạng trong từng hoàn cảnh cụ thể.", "e": "Cá nhân lãnh đạo có vai trò rất quan trọng trong tổ chức và định hướng phong trào, có thể tác động trực tiếp đến thành công hay thất bại trong những hoàn cảnh cụ thể, nhưng không thay thế vai trò quyết định lịch sử của quần chúng.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Quyết định toàn bộ lịch sử thay cho quần chúng", "Không có ảnh hưởng nào đến phong trào", "Chỉ giữ vai trò tượng trưng"]}, {"id": 82, "q": "Những phẩm chất cơ bản mà người lãnh tụ của quần chúng nhân dân cần có là:", "letter": "A", "a": "Trí tuệ uyên bác vượt trội; Năng lực tổ chức, tập hợp quần chúng; Phẩm chất đạo đức, ý chí phục vụ nhân dân.", "e": "Một lãnh tụ cần có tri thức và tầm nhìn, năng lực tổ chức - tập hợp quần chúng, cùng phẩm chất đạo đức và ý chí phục vụ lợi ích của nhân dân. Phương án A bao quát đủ ba nhóm phẩm chất này.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Chỉ cần quyền lực hành chính", "Chỉ cần kiến thức chuyên môn, không cần đạo đức", "Chỉ cần khả năng diễn thuyết, không cần tổ chức"]}, {"id": 83, "q": "Nguyên nhân sâu xa dẫn đến cách mạng xã hội là:", "letter": "C", "a": "Mâu thuẫn giữa lực lượng sản xuất và quan hệ sản xuất", "e": "Nguyên nhân sâu xa của cách mạng xã hội là mâu thuẫn giữa lực lượng sản xuất đã phát triển với quan hệ sản xuất trở nên lạc hậu, kìm hãm lực lượng sản xuất.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Mâu thuẫn giữa các sở thích cá nhân", "Mâu thuẫn giữa các vùng khí hậu", "Mâu thuẫn giữa các thế hệ vì tuổi tác"]}, {"id": 84, "q": "Cách mạng vô sản là một cuộc cách mạng xã hội mới về chất, vì:", "letter": "D", "a": "Vì nó sẽ xóa bỏ hoàn toàn chế độ người bóc lột người", "e": "Cách mạng vô sản được coi là mới về chất vì mục tiêu cuối cùng không chỉ thay một giai cấp bóc lột bằng giai cấp bóc lột khác, mà hướng tới xóa bỏ chế độ người bóc lột người.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Vì chỉ thay người lãnh đạo mà không đổi chế độ", "Vì củng cố chế độ bóc lột cũ", "Vì chỉ cải tiến kỹ thuật sản xuất"]}, {"id": 85, "q": "Quan điểm của chủ nghĩa duy vật lịch sử, con người là:", "letter": "A", "a": "Một thực thể tự nhiên mang đặc tính xã hội", "e": "Chủ nghĩa duy vật lịch sử xem con người là một thực thể tự nhiên đồng thời mang bản chất xã hội. Trong các lựa chọn, phương án A thể hiện đúng nhất sự thống nhất hai mặt này.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Một thực thể sinh học thuần túy", "Một thực thể tinh thần tách khỏi tự nhiên", "Một cá thể không chịu ảnh hưởng xã hội"]}, {"id": 86, "q": "Theo C.Mác: Trong tính hiện thực của nó, bản chất con người là:", "letter": "D", "a": "Tổng hòa những quan hệ xã hội", "e": "Theo C. Mác, bản chất con người trong hiện thực là tổng hòa những quan hệ xã hội, nghĩa là được hình thành và bộc lộ trong các quan hệ xã hội cụ thể.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Tổng hợp các bản năng sinh học", "Một ý niệm tinh thần có sẵn", "Tổng hợp đặc điểm di truyền thuần túy"]}, {"id": 87, "q": "Con người sẽ bộc lộ được bản chất xã hội của mình khi:", "letter": "A", "a": "Khi tồn tại trong các quan hệ xã hội", "e": "Con người bộc lộ bản chất xã hội khi tồn tại và hoạt động trong các quan hệ xã hội. Tách khỏi các quan hệ đó thì không thể giải thích đầy đủ bản chất xã hội của con người.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Khi hoàn toàn tách khỏi xã hội", "Chỉ khi thực hiện các chức năng sinh học", "Khi không có bất kỳ hoạt động giao tiếp nào"]}, {"id": 88, "q": "Cơ sở ra đời của nhà nước là do:", "letter": "C", "a": "Yêu cầu của đấu tranh giai cấp, là công cụ của giai cấp cầm quyền", "e": "Nhà nước có cơ sở ra đời từ xã hội phân chia giai cấp và yêu cầu của đấu tranh giai cấp; nó trở thành công cụ quyền lực của giai cấp giữ địa vị thống trị trong xã hội có giai cấp.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Nhu cầu giải trí của cộng đồng", "Sự xuất hiện của chữ viết", "Sự phân chia theo đặc điểm địa lý đơn thuần"]}, {"id": 89, "q": "Kiểu nhà nước đầu tiên trong lịch sử là:", "letter": "B", "a": "Nhà nước chủ nô", "e": "Kiểu nhà nước đầu tiên xuất hiện trong lịch sử xã hội có giai cấp là nhà nước chủ nô, gắn với hình thái kinh tế - xã hội chiếm hữu nô lệ.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Nhà nước phong kiến", "Nhà nước tư sản", "Nhà nước xã hội chủ nghĩa"]}, {"id": 90, "q": "Các cá nhân không hòa tan với nhau trong tập thể là do:", "letter": "C", "a": "Do có nhân cách khác nhau", "e": "Mỗi cá nhân có nhân cách riêng, thể hiện những phẩm chất và đặc điểm xã hội - tâm lý riêng biệt. Vì vậy khi tham gia tập thể, cá nhân vẫn giữ tính độc đáo và không bị 'hòa tan'.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Do hoàn toàn không có quan hệ xã hội", "Do mọi người có nhân cách giống nhau", "Do không chịu bất kỳ ảnh hưởng nào của tập thể"]}, {"id": 91, "q": "Quần chúng nhân dân là:", "letter": "A", "a": "Là những người sản xuất ra của cải vật chất, những bộ phận dân cư chống lại giai cấp thống trị, những bộ phận thúc đẩy sự tiến bộ xã hội", "e": "Quần chúng nhân dân là bộ phận đông đảo có lợi ích cơ bản phù hợp với tiến bộ xã hội trong một thời kỳ nhất định, gồm người sản xuất vật chất và những lực lượng tham gia thúc đẩy tiến bộ, chống lại các lực lượng cản trở.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Chỉ những người giữ chức vụ lãnh đạo", "Chỉ những người có tài sản lớn", "Chỉ một nhóm người tách biệt khỏi tiến bộ xã hội"]}, {"id": 92, "q": "Vai trò của quần chúng nhân dân trong lịch sử:", "letter": "B", "a": "Là chủ thế sáng tạo chân chính ra lịch sử, quyết định sự phát triển của lịch sử", "e": "Quần chúng nhân dân là chủ thể sáng tạo chân chính ra lịch sử và giữ vai trò quyết định đối với sự phát triển lịch sử thông qua hoạt động sản xuất và hoạt động xã hội của mình.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Chỉ tiếp nhận thụ động các quyết định của lãnh tụ", "Không tham gia sáng tạo giá trị tinh thần", "Không có vai trò trong biến đổi xã hội"]}, {"id": 93, "q": "Vai trò cá nhân người lãnh đạo của quần chúng nhân dân là:", "letter": "D", "a": "Có ý nghĩa quyết định trực tiếp đến thành công hay thất bại của các phong trào cách mạng trong từng hoàn cảnh cụ thể.", "e": "Người lãnh đạo có thể quyết định trực tiếp đến hiệu quả tổ chức, thành công hay thất bại của một phong trào trong hoàn cảnh cụ thể; nhưng họ không quyết định toàn bộ tiến trình lịch sử thay cho quần chúng.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Quyết định toàn bộ lịch sử thay cho quần chúng", "Không có ảnh hưởng nào đến phong trào", "Chỉ giữ vai trò tượng trưng"]}, {"id": 94, "q": "Những phẩm chất cơ bản mà người lãnh tụ của quần chúng nhân dân cần có là:", "letter": "A", "a": "Trí tuệ uyên bác vượt trội; Năng lực tổ chức, tập hợp quần chúng; Phẩm chất đạo đức, ý chí phục vụ nhân dân.", "e": "Ba nhóm phẩm chất nổi bật của lãnh tụ là năng lực trí tuệ, năng lực tổ chức và tập hợp quần chúng, cùng phẩm chất đạo đức và ý chí phục vụ nhân dân. Phương án A phù hợp nhất.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Chỉ cần quyền lực hành chính", "Chỉ cần kiến thức chuyên môn, không cần đạo đức", "Chỉ cần khả năng diễn thuyết, không cần tổ chức"]}, {"id": 95, "q": "Chọn cụm từ thích hợp điềm vào chỗ trống: Nhận thức là ..... tích cực, sáng tạo thế giới khách quan vào bộ óc con người trên cơ cở thực tiễn, nhằm sáng tạo ra những tri thức về thế giới khách quan đó.", "letter": "C", "a": "Quá trình phản ánh.", "e": "Nhận thức là một quá trình phản ánh tích cực, tự giác và sáng tạo thế giới khách quan vào bộ óc con người trên cơ sở thực tiễn. Vì vậy cụm đúng là 'quá trình phản ánh'.", "topic": 2, "type": "Điền khuyết", "wrong": ["Quá trình tưởng tượng tùy ý", "Quá trình phủ nhận", "Quá trình sao chép máy móc"]}, {"id": 96, "q": "Thực tiễn là gì?", "letter": "C", "a": "Là hoạt động vật chất có mục đích mang tính lịch sử - xã hội của con người nhằm cải tạo tự nhiên và xã hội.", "e": "Thực tiễn là toàn bộ hoạt động vật chất có mục đích, mang tính lịch sử - xã hội của con người nhằm cải tạo tự nhiên và xã hội. Hoạt động tinh thần thuần túy không được xếp trực tiếp vào thực tiễn.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Hoạt động tinh thần thuần túy", "Hoạt động bản năng của động vật", "Hoạt động suy tưởng tách khỏi đời sống vật chất"]}, {"id": 97, "q": "Đấu tranh giai cấp, đấu tranh giải phóng dân tộc, đấu tranh cho hòa bình, dân chủ, tiến bộ xã hội là nội dung của hoạt động nào?", "letter": "B", "a": "Hoạt động chính trị - xã hội.", "e": "Đấu tranh giai cấp, giải phóng dân tộc, đấu tranh vì hòa bình, dân chủ và tiến bộ xã hội thuộc hình thức hoạt động thực tiễn chính trị - xã hội.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Hoạt động sản xuất vật chất", "Hoạt động thực nghiệm khoa học", "Hoạt động nhận thức cảm tính"]}, {"id": 98, "q": "Trong các hình thức của hoạt động thực tiễn, hoạt động nào giữ vai trò quyết định?", "letter": "A", "a": "Hoạt động sản xuất vật chất.", "e": "Trong các hình thức thực tiễn, sản xuất vật chất giữ vai trò quyết định vì nó tạo ra điều kiện vật chất cho sự tồn tại của con người và xã hội, đồng thời là nền tảng cho các hoạt động khác.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Hoạt động chính trị - xã hội", "Hoạt động thực nghiệm khoa học", "Hoạt động suy luận lý thuyết"]}, {"id": 99, "q": "Hoạt động tất yếu, đầu tiên của con người và xã hội loài người là hoạt động nào?", "letter": "B", "a": "Hoạt động sản xuất vật chất.", "e": "Hoạt động sản xuất vật chất là hoạt động tất yếu và đầu tiên vì con người phải tạo ra tư liệu sinh hoạt để tồn tại trước khi có thể tiến hành các hoạt động chính trị, khoa học hay tinh thần khác.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Hoạt động chính trị - xã hội", "Hoạt động thực nghiệm khoa học", "Hoạt động suy luận lý thuyết"]}, {"id": 100, "q": "Theo quan điểm của triết học Mác – Lênin, nguyên nhân trực tiếp của sự xuất hiện giai cấp là gì?", "letter": "B", "a": "Sự xuất hiện chế độ tư hữu về tư liệu sản xuất.", "e": "Nguyên nhân trực tiếp của sự xuất hiện giai cấp là chế độ tư hữu về tư liệu sản xuất. Sự phát triển lực lượng sản xuất và xuất hiện sản phẩm dư thừa là nguyên nhân sâu xa tạo điều kiện cho tư hữu hình thành.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Sự ra đời của ngôn ngữ", "Sự khác nhau về tuổi tác", "Sự xuất hiện các hình thức tín ngưỡng"]}, {"id": 101, "q": "Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?", "letter": "D", "a": "Phủ định biện chứng phụ thuộc vào ý thức của con người.", "e": "Phủ định biện chứng có tính khách quan, bắt nguồn từ việc giải quyết những mâu thuẫn bên trong sự vật, hiện tượng, không phụ thuộc vào ý muốn chủ quan của con người.", "topic": 1, "type": "Tìm đáp án sai / loại trừ", "wrong": ["Phủ định biện chứng có tính khách quan", "Phủ định biện chứng có tính kế thừa", "Phủ định biện chứng bắt nguồn từ mâu thuẫn bên trong"]}, {"id": 102, "q": "Yếu tố quan trọng nhất trong kết cấu của ý thức là gì?", "letter": "D", "a": "Tri thức.", "e": "Tri thức là phương thức tồn tại và là yếu tố cơ bản nhất của ý thức. Tri thức giúp con người nhận thức thế giới, định hướng hành động và cải tạo hiện thực.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Tình cảm", "Ý chí", "Niềm tin"]}, {"id": 103, "q": "Trong bối cảnh Cách mạng công nghiệp lần thứ tư, sự phát triển của trí tuệ nhân tạo (AI) có tác động như thế nào đối với hoạt động sản xuất của các doanh nghiệp Việt Nam?", "letter": "C", "a": "AI làm thay đổi cách thức tổ chức, quản lý sản xuất.", "e": "AI góp phần phát triển lực lượng sản xuất, nâng cao năng suất lao động, tự động hóa các quy trình và làm thay đổi phương thức tổ chức, quản lý sản xuất của doanh nghiệp.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["AI làm cho phương thức tổ chức sản xuất không đổi", "AI chỉ ảnh hưởng tiêu dùng, không ảnh hưởng sản xuất", "AI khiến công nghệ không còn vai trò trong sản xuất"]}, {"id": 104, "q": "Phương diện nào trong phương thức sản xuất thể hiện mối quan hệ giữa con người với con người trong quá trình sản xuất vật chất?", "letter": "C", "a": "Quan hệ sản xuất.", "e": "Quan hệ sản xuất là tổng thể những quan hệ kinh tế giữa con người với con người trong quá trình sản xuất vật chất, bao gồm quan hệ sở hữu, tổ chức quản lý và phân phối sản phẩm lao động.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Lực lượng sản xuất", "Kiến trúc thượng tầng", "Ý thức xã hội"]}, {"id": 105, "q": "Phương diện nào trong phương thức sản xuất thể hiện mối quan hệ giữa con người với tự nhiên trong quá trình sản xuất vật chất?", "letter": "C", "a": "Lực lượng sản xuất.", "e": "Lực lượng sản xuất thể hiện năng lực thực tiễn của con người trong quá trình tác động, cải biến giới tự nhiên để tạo ra của cải vật chất, bao gồm người lao động và tư liệu sản xuất.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Quan hệ sản xuất", "Kiến trúc thượng tầng", "Ý thức pháp quyền"]}, {"id": 106, "q": "Một nhà khoa học khi nghiên cứu một hiện tượng xã hội chỉ chú ý đến các yếu tố thống kê tĩnh tại ở một thời điểm, tách rời hiện tượng đó khỏi hoàn cảnh lịch sử và phủ nhận mâu thuẫn bên trong của nó. Cách nghiên cứu này mang đặc trưng của phương pháp tư duy nào?", "letter": "D", "a": "Phương pháp siêu hình.", "e": "Phương pháp siêu hình xem xét sự vật trong trạng thái cô lập, tĩnh tại, không chú ý đến các mối liên hệ, sự vận động, phát triển và mâu thuẫn bên trong sự vật.", "topic": 0, "type": "Vận dụng / tình huống", "wrong": ["Phương pháp biện chứng", "Phương pháp lịch sử - cụ thể", "Phương pháp tiếp cận toàn diện"]}, {"id": 107, "q": "Nghị quyết số 57-NQ/TW về đột phá, phát triển khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số quốc gia của Bộ Chính trị ban hành năm 2024 phản ánh sự vận dụng nội dung nào trong học thuyết hình thái kinh tế - xã hội?", "letter": "D", "a": "Quy luật về sự phù hợp của quan hệ sản xuất với trình độ của lực lượng sản xuất.", "e": "Khoa học, công nghệ và chuyển đổi số thúc đẩy sự phát triển của lực lượng sản xuất. Điều này đòi hỏi quan hệ sản xuất, cơ chế quản lý và các hình thức tổ chức sản xuất phải được điều chỉnh phù hợp với trình độ phát triển mới.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["Quy luật phủ định của phủ định", "Quy luật tồn tại xã hội quyết định ý thức xã hội", "Quy luật mâu thuẫn nói chung"]}, {"id": 108, "q": "Việc các trường đại học đưa nội dung phòng chống tham nhũng, an ninh mạng vào chương trình đào tạo là sự vận dụng chủ yếu của hình thái ý thức xã hội nào?", "letter": "C", "a": "Ý thức pháp quyền.", "e": "Ý thức pháp quyền phản ánh những quan điểm, tư tưởng và thái độ của con người đối với pháp luật. Giáo dục phòng chống tham nhũng và an ninh mạng góp phần nâng cao nhận thức, trách nhiệm và ý thức chấp hành pháp luật.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["Ý thức thẩm mỹ", "Ý thức tôn giáo", "Ý thức khoa học"]}, {"id": 109, "q": "Căn cứ vào đâu để phân chia giai cấp thành giai cấp cơ bản và giai cấp không cơ bản?", "letter": "B", "a": "Vào phương thức sản xuất mà giai cấp đó đại diện.", "e": "Giai cấp cơ bản là những giai cấp gắn với phương thức sản xuất thống trị trong xã hội. Giai cấp không cơ bản gắn với những phương thức sản xuất khác còn tồn tại trong xã hội đó.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Vào số lượng thành viên của giai cấp", "Vào địa bàn cư trú", "Vào trình độ học vấn trung bình"]}, {"id": 110, "q": "Một doanh nghiệp tại Việt Nam đầu tư dây chuyền sản xuất tự động nhằm nâng cao năng lực sản xuất, đồng thời thực hiện đầy đủ các quy định pháp luật về lao động và bảo vệ môi trường. Tình huống trên là biểu hiện phương diện nào của nền sản xuất xã hội?", "letter": "C", "a": "Tất cả các câu trả lời đều đúng.", "e": "Việc đầu tư dây chuyền tự động thể hiện sự phát triển lực lượng sản xuất. Việc tuân thủ pháp luật về lao động góp phần duy trì quan hệ sản xuất và bảo đảm sự ổn định của cơ sở kinh tế. Xét theo ý bao quát của đề bài, phương án C phù hợp nhất, mặc dù cách diễn đạt “bảo vệ cơ sở hạ tầng” chưa thật chặt chẽ về mặt thuật ngữ triết học.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["Chỉ phát triển lực lượng sản xuất", "Chỉ thực hiện các quy định pháp luật", "Chỉ duy trì quan hệ sản xuất"], "display": "Phát triển lực lượng sản xuất, thực hiện các quy định pháp luật và duy trì quan hệ sản xuất."}, {"id": 111, "q": "Theo chủ nghĩa duy vật lịch sử, nhà nước mang bản chất của:", "letter": "B", "a": "Giai cấp thống trị.", "e": "Theo chủ nghĩa duy vật lịch sử, nhà nước ra đời khi mâu thuẫn giai cấp không thể điều hòa được. Nhà nước là công cụ quyền lực chính trị của giai cấp thống trị nhằm duy trì và bảo vệ lợi ích của giai cấp đó.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Mọi giai cấp một cách trung lập tuyệt đối", "Giai cấp bị trị trong mọi chế độ", "Các cá nhân không có địa vị kinh tế"]}, {"id": 112, "q": "Nhận định nào sau đây là sai?", "letter": "B", "a": "Trong kết cấu của ý thức xã hội, tâm lý xã hội và hệ tư tưởng tách rời nhau.", "e": "Tâm lý xã hội và hệ tư tưởng có mối quan hệ mật thiết, tác động qua lại lẫn nhau. Tâm lý xã hội tạo điều kiện hình thành hệ tư tưởng, còn hệ tư tưởng tác động trở lại tâm lý xã hội.", "topic": 3, "type": "Tìm đáp án sai / loại trừ", "wrong": ["Tâm lý xã hội và hệ tư tưởng có quan hệ với nhau", "Tâm lý xã hội ảnh hưởng đến sự hình thành hệ tư tưởng", "Hệ tư tưởng có thể tác động trở lại tâm lý xã hội"]}, {"id": 113, "q": "Việc các trường đại học đưa nội dung phòng chống tham nhũng, an ninh mạng vào chương trình đào tạo là sự vận dụng chủ yếu của hình thái ý thức xã hội nào?", "letter": "B", "a": "Ý thức pháp quyền.", "e": "Những nội dung này giúp sinh viên nhận thức được các quy định pháp luật, quyền và nghĩa vụ của công dân, từ đó hình thành ý thức tôn trọng và chấp hành pháp luật.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["Ý thức thẩm mỹ", "Ý thức tôn giáo", "Ý thức khoa học"]}, {"id": 114, "q": "Để viết báo cáo nội dung tính lạc hậu của ý thức xã hội, nguồn minh chứng nào sau đây phù hợp nhất?", "letter": "C", "a": "Tập quán, hủ tục còn tồn tại ở địa phương.", "e": "Ý thức xã hội thường lạc hậu hơn tồn tại xã hội do sức mạnh của thói quen, truyền thống và tập quán. Những hủ tục vẫn tồn tại mặc dù điều kiện kinh tế, xã hội đã thay đổi là minh chứng rõ ràng cho tính lạc hậu của ý thức xã hội.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["Sáng kiến công nghệ mới vượt trước thực tế", "Dự báo xu hướng xã hội tương lai", "Bản thiết kế một sản phẩm chưa từng xuất hiện"]}, {"id": 115, "q": "Một cán bộ quản lý cho rằng chỉ cần học thuộc lòng các nguyên lý triết học Mác - Lênin là có thể tự động giải quyết mọi vấn đề phức tạp tại địa phương mà không cần khảo sát thực tiễn. Theo phương pháp luận mácxít, cán bộ này đã mắc phải sai lầm gì?", "letter": "A", "a": "Tuyệt đối hóa vai trò của triết học, sa vào chủ nghĩa giáo điều khi áp dụng máy móc các nguyên lý chung mà không tính đến “kinh nghiệm cụ thể của lịch sử”.", "e": "Triết học cung cấp thế giới quan và phương pháp luận chung, không thay thế được việc nghiên cứu thực tiễn. Việc áp dụng máy móc lý luận mà không căn cứ vào điều kiện cụ thể là biểu hiện của chủ nghĩa giáo điều.", "topic": 0, "type": "Vận dụng / tình huống", "wrong": ["Tôn trọng quan điểm lịch sử - cụ thể", "Thống nhất lý luận với thực tiễn", "Vận dụng sáng tạo lý luận theo điều kiện địa phương"]}, {"id": 116, "q": "Khi xem xét một sự vật, nếu chủ thể nhận thức \"chỉ nhìn thấy cây mà không thấy rừng\", chỉ nhìn thấy trạng thái tĩnh mà quên mất sự vận động của sự vật, thì chủ thể đó đang mắc phải sai lầm của phương pháp tư duy nào?", "letter": "C", "a": "Phương pháp siêu hình.", "e": "Phương pháp siêu hình xem xét sự vật một cách cô lập, phiến diện và tĩnh tại, không nhận thức đầy đủ mối liên hệ giữa các bộ phận cũng như sự vận động, phát triển của sự vật.", "topic": 0, "type": "Vận dụng / tình huống", "wrong": ["Phương pháp biện chứng", "Phương pháp lịch sử - cụ thể", "Phương pháp tiếp cận toàn diện"]}, {"id": 117, "q": "Việc các trường đại học tăng cường giáo dục đạo đức nghề nghiệp, trách nhiệm xã hội và văn hóa ứng xử cho sinh viên trong nội dung chương trình đào tạo là sự thể hiện của hình thái ý thức xã hội nào?", "letter": "D", "a": "Ý thức đạo đức.", "e": "Ý thức đạo đức phản ánh những quan niệm về cái thiện, cái ác, trách nhiệm, nghĩa vụ và các chuẩn mực ứng xử của con người trong xã hội.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["Ý thức thẩm mỹ", "Ý thức tôn giáo", "Ý thức pháp quyền"]}, {"id": 118, "q": "Thống nhất của hai mặt đối lập là:", "letter": "C", "a": "Sự nương tựa lẫn nhau, tồn tại không tách rời nhau, mặt này lấy mặt kia làm tiền đề cho sự tồn tại của mình và ngược lại.", "e": "Các mặt đối lập vừa có khuynh hướng trái ngược nhau, vừa liên hệ và phụ thuộc lẫn nhau. Sự tồn tại của mặt đối lập này là điều kiện, tiền đề cho sự tồn tại của mặt đối lập kia.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Sự loại trừ hoàn toàn lẫn nhau", "Sự tồn tại hoàn toàn độc lập của hai mặt", "Sự biến mất ngay lập tức của mọi mâu thuẫn"]}, {"id": 119, "q": "Trong quá trình lãnh đạo cách mạng, Đảng Cộng sản Việt Nam đã đóng góp quan trọng vào sự phát triển kho tàng triết học Mác - Lênin thông qua việc hoạch định đường lối thực hiện đồng thời hai nhiệm vụ chiến lược nào sau năm 1954?", "letter": "A", "a": "Xây dựng chủ nghĩa xã hội ở miền Bắc; đấu tranh giải phóng dân tộc, thống nhất Tổ quốc ở miền Nam.", "e": "Sau năm 1954, cách mạng Việt Nam thực hiện đồng thời hai nhiệm vụ chiến lược phù hợp với hoàn cảnh lịch sử của mỗi miền, hướng tới mục tiêu chung là giải phóng miền Nam và thống nhất đất nước.", "topic": 0, "type": "Vận dụng / tình huống", "wrong": ["Chỉ phát triển kinh tế ở cả hai miền, không đặt nhiệm vụ thống nhất", "Xây dựng chủ nghĩa xã hội ở miền Nam, giải phóng miền Bắc", "Chỉ thực hiện một nhiệm vụ ở miền Bắc, không có nhiệm vụ ở miền Nam"]}, {"id": 120, "q": "Bản chất chế độ sở hữu xã hội chủ nghĩa là:", "letter": "C", "a": "Chế độ công hữu về tư liệu sản xuất.", "e": "Theo lý luận của chủ nghĩa Mác - Lênin, chế độ sở hữu xã hội chủ nghĩa lấy chế độ công hữu về những tư liệu sản xuất chủ yếu làm nền tảng, hướng tới lợi ích chung của xã hội.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Chế độ tư hữu tuyệt đối về tư liệu sản xuất", "Chế độ sở hữu cá nhân độc quyền mọi tư liệu sản xuất", "Chế độ sở hữu phong kiến về ruộng đất"]}, {"id": 121, "q": "Bài học kinh nghiệm mà Đảng Cộng sản Việt Nam rút ra trong công cuộc đổi mới là gì?", "letter": "A", "a": "Kết hợp đổi mới kinh tế và đổi mới chính trị.", "e": "Đổi mới kinh tế và đổi mới chính trị có mối quan hệ biện chứng, tác động qua lại lẫn nhau. Trong quá trình đổi mới, cần lấy đổi mới kinh tế làm trọng tâm, đồng thời từng bước đổi mới chính trị phù hợp.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["Chỉ đổi mới chính trị, giữ nguyên kinh tế", "Tách rời đổi mới kinh tế khỏi chính trị", "Không điều chỉnh chính sách theo thực tiễn"]}, {"id": 122, "q": "Quy luật được coi là hạt nhân của phép biện chứng duy vật là:", "letter": "A", "a": "Quy luật thống nhất và đấu tranh của các mặt đối lập.", "e": "Quy luật thống nhất và đấu tranh của các mặt đối lập chỉ ra nguồn gốc và động lực bên trong của sự vận động, phát triển của sự vật, hiện tượng. Vì vậy, nó được coi là hạt nhân của phép biện chứng duy vật.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Quy luật lượng - chất", "Quy luật phủ định của phủ định", "Quy luật nhân quả"]}, {"id": 123, "q": "Trong bối cảnh chuyển đổi số ở Việt Nam hiện nay, việc xây dựng Chính phủ số phản ánh yếu tố nào trong kiến trúc thượng tầng?", "letter": "C", "a": "Chính trị và pháp quyền.", "e": "Chính phủ là bộ phận của bộ máy nhà nước, thuộc kiến trúc thượng tầng. Xây dựng Chính phủ số góp phần đổi mới phương thức quản lý nhà nước, nâng cao hiệu quả hoạt động hành chính và thực thi pháp luật.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["Chỉ lực lượng sản xuất", "Chỉ quan hệ phân phối sản phẩm", "Chỉ công cụ lao động"]}, {"id": 124, "q": "“Trong quá trình xây dựng đại học số, cần kế thừa những giá trị của giáo dục truyền thống nhưng phải đổi mới phương pháp dạy học, ứng dụng công nghệ và phát triển năng lực người học”. Đây là quan điểm:", "letter": "A", "a": "Phát triển.", "e": "Quan điểm phát triển yêu cầu xem xét sự vật trong quá trình vận động và biến đổi, đồng thời kế thừa những yếu tố tích cực của cái cũ và đổi mới những yếu tố không còn phù hợp để thúc đẩy cái mới ra đời.", "topic": 1, "type": "Vận dụng / tình huống", "wrong": ["Quan điểm tĩnh tại", "Quan điểm phủ định sạch trơn", "Quan điểm duy ý chí"]}, {"id": 125, "q": "Trong bối cảnh hội nhập quốc tế và chuyển đổi số của Việt Nam hiện nay, yêu cầu quan trọng nhất đối với người lao động là gì?", "letter": "D", "a": "Có chuyên môn, kỹ năng nghề nghiệp vững vàng; chủ động rèn luyện sức khỏe và học tập suốt đời, nâng cao năng lực số, tác phong công nghiệp, kỷ luật lao động và tuân thủ pháp luật.", "e": "Người lao động là nhân tố hàng đầu của lực lượng sản xuất. Trong bối cảnh khoa học và công nghệ phát triển, người lao động cần nâng cao toàn diện kiến thức, kỹ năng, sức khỏe, đạo đức và khả năng thích ứng với những thay đổi của xã hội.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["Chỉ cần bằng cấp, không cần học thêm", "Chỉ cần kỹ năng số, không cần kỷ luật", "Chỉ cần kinh nghiệm cũ, không cần cập nhật công nghệ"]}, {"id": 126, "q": "Quan điểm cho rằng: “Phụ nữ chỉ nên làm công việc nội trợ, không phù hợp với các vị trí lãnh đạo”. Đây là quan điểm:", "letter": "D", "a": "Định kiến.", "e": "Đây là định kiến giới, xuất phát từ những quan niệm chủ quan và khuôn mẫu xã hội. Quan điểm này không xem xét khách quan năng lực, phẩm chất và khả năng phát triển của mỗi cá nhân.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["Bình đẳng giới", "Quan điểm khách quan", "Đánh giá dựa trên năng lực cá nhân"]}, {"id": 127, "q": "Tìm đáp án sai theo quan điểm của chủ nghĩa duy vật biện chứng về vai trò của thực tiễn đối với nhận thức:", "letter": "C", "a": "Nhận thức không cần có thực tiễn.", "e": "Thực tiễn là cơ sở, động lực, mục đích của nhận thức và là tiêu chuẩn kiểm tra chân lý. Nhận thức của con người phải xuất phát từ thực tiễn và được kiểm nghiệm thông qua thực tiễn.", "topic": 2, "type": "Tìm đáp án sai / loại trừ", "wrong": ["Thực tiễn là cơ sở của nhận thức", "Thực tiễn là mục đích của nhận thức", "Thực tiễn là tiêu chuẩn kiểm tra chân lý"]}, {"id": 128, "q": "Khi làm việc nhóm để giải quyết một đề tài nghiên cứu về nguyên nhân sụp đổ của mô hình chủ nghĩa xã hội ở Liên Xô và Đông Âu, sinh viên cần vận dụng phương pháp luận triết học Mác - Lênin như thế nào để có cách phân tích khoa học nhất?", "letter": "B", "a": "Phân tích sự việc một cách toàn diện, lịch sử - cụ thể, tìm ra nguyên nhân từ những sai lầm chủ quan, giáo điều, xa rời lập trường Mác - Lênin chứ không phải do bản chất của chủ nghĩa xã hội.", "e": "Theo phương pháp luận Mác - Lênin, cần xem xét sự kiện trong hoàn cảnh lịch sử cụ thể, phân tích tổng hợp các yếu tố kinh tế, chính trị, xã hội và tư tưởng, tránh đánh giá phiến diện hoặc tuyệt đối hóa một nguyên nhân. Trong các lựa chọn của đề bài, B phù hợp nhất với cách tiếp cận này.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["Chỉ dựa trên một nguyên nhân duy nhất, bỏ qua bối cảnh", "Chỉ dựa trên cảm xúc cá nhân thay vì tài liệu", "Tách sự kiện khỏi hoàn cảnh lịch sử cụ thể"]}, {"id": 129, "q": "Theo quan điểm của triết học Mác - Lênin, với tư cách là một hình thái ý thức xã hội, triết học ra đời dựa trên những nguồn gốc cơ bản nào?", "letter": "A", "a": "Nguồn gốc nhận thức và nguồn gốc xã hội.", "e": "Nguồn gốc nhận thức xuất phát từ sự phát triển của tư duy trừu tượng và khả năng khái quát hóa của con người. Nguồn gốc xã hội gắn với sự phát triển của sản xuất, phân công lao động xã hội và sự phân chia lao động trí óc với lao động chân tay.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Nguồn gốc sinh học và khí hậu", "Nguồn gốc địa lý và tôn giáo", "Nguồn gốc tâm lý cá nhân và di truyền"]}, {"id": 130, "q": "Trong xã hội sự phát triển biểu hiện ra như thế nào?", "letter": "A", "a": "Sự thay thế chế độ xã hội này bằng một chế độ xã hội khác cao hơn, dân
