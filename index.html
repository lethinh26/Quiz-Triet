chủ, văn minh hơn.", "e": "Theo quan điểm của phép biện chứng duy vật, phát triển là quá trình vận động theo khuynh hướng đi lên, từ thấp đến cao, từ đơn giản đến phức tạp. Trong xã hội, sự phát triển thể hiện ở quá trình thay thế những hình thức tổ chức xã hội cũ bằng những hình thức tiến bộ hơn.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Sự lặp lại nguyên trạng của chế độ xã hội", "Sự bất biến tuyệt đối của tổ chức xã hội", "Chỉ tăng số lượng dân cư mà không đổi chất xã hội"]}, {"id": 131, "q": "Thực tiễn là:", "letter": "B", "a": "Hoạt động vật chất của con người nhằm cải tạo tự nhiên và xã hội theo nhu cầu của con người ở mỗi giai đoạn lịch sử.", "e": "Thực tiễn là toàn bộ những hoạt động vật chất có mục đích, mang tính lịch sử - xã hội của con người nhằm cải biến tự nhiên và xã hội. Các hình thức cơ bản của thực tiễn gồm sản xuất vật chất, hoạt động chính trị - xã hội và thực nghiệm khoa học.", "topic": 2, "type": "Kiến thức / lý thuyết", "wrong": ["Hoạt động tinh thần thuần túy", "Hoạt động bản năng của động vật", "Hoạt động suy tưởng tách khỏi đời sống vật chất"]}, {"id": 132, "q": "Hình thức triết học nào thừa nhận tính thứ nhất của ý thức con người, khẳng định mọi sự vật, hiện tượng chỉ là phức hợp của những cảm giác?", "letter": "D", "a": "Chủ nghĩa duy tâm chủ quan.", "e": "Chủ nghĩa duy tâm chủ quan coi ý thức, cảm giác của con người là cái có trước, là cơ sở của sự tồn tại của sự vật, hiện tượng; phủ nhận sự tồn tại khách quan của thế giới vật chất độc lập với ý thức.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Chủ nghĩa duy vật biện chứng", "Chủ nghĩa duy tâm khách quan", "Chủ nghĩa duy vật siêu hình"]}, {"id": 133, "q": "Tính quy định nói lên quy mô, trình độ phát triển của sự vật được gọi là gì?", "letter": "B", "a": "Lượng.", "e": "Lượng là phạm trù triết học dùng để chỉ tính quy định khách quan của sự vật về mặt số lượng, quy mô, trình độ phát triển, tốc độ và nhịp điệu vận động của sự vật.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Chất", "Độ", "Điểm nút"]}, {"id": 134, "q": "Phạm trù triết học nào dùng để chỉ tổng hợp tất cả những mặt, những yếu tố, những quá trình tạo nên sự vật?", "letter": "D", "a": "Nội dung.", "e": "Nội dung là phạm trù triết học chỉ tổng hợp tất cả những mặt, yếu tố và quá trình tạo nên sự vật. Hình thức là phương thức tồn tại và phát triển của nội dung đó.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Hình thức", "Hiện tượng", "Ngẫu nhiên"]}, {"id": 135, "q": "Thực chất của quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng là:", "letter": "A", "a": "Quan hệ giữa kinh tế và chính trị.", "e": "Cơ sở hạ tầng là toàn bộ những quan hệ sản xuất hợp thành cơ cấu kinh tế của xã hội. Kiến trúc thượng tầng bao gồm các quan điểm, tư tưởng và thiết chế xã hội tương ứng. Thực chất của mối quan hệ này là quan hệ giữa kinh tế và chính trị, trong đó kinh tế giữ vai trò quyết định và chính trị tác động trở lại kinh tế.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Quan hệ giữa cảm giác và tri giác", "Quan hệ giữa lượng và chất", "Quan hệ giữa cá nhân và tự nhiên"]}, {"id": 136, "q": "Ph. Ăngghen đã chỉ rõ: \"Vấn đề cơ bản lớn của mọi triết học, đặc biệt là của triết học hiện đại, là vấn đề...\" gì?", "letter": "B", "a": "Quan hệ giữa tư duy với tồn tại.", "e": "Vấn đề cơ bản của triết học là mối quan hệ giữa vật chất và ý thức, hay giữa tồn tại và tư duy. Vấn đề này gồm hai mặt: cái nào có trước, cái nào quyết định cái nào và con người có khả năng nhận thức thế giới hay không.", "topic": 0, "type": "Điền khuyết", "wrong": ["Mối quan hệ giữa cá nhân và tập thể", "Mối quan hệ giữa kinh tế và chính trị", "Mối quan hệ giữa giai cấp và nhà nước"]}, {"id": 137, "q": "Loại hình thế giới quan nào được coi là đỉnh cao của các loại thế giới quan trong lịch sử vì đòi hỏi thế giới phải được xem xét dựa trên nguyên lý về mối liên hệ phổ biến và sự phát triển?", "letter": "B", "a": "Thế giới quan duy vật biện chứng.", "e": "Theo triết học Mác - Lênin, thế giới quan duy vật biện chứng kết hợp chủ nghĩa duy vật với phép biện chứng, xem xét thế giới trong tính khách quan, trong các mối liên hệ phổ biến và quá trình vận động, phát triển không ngừng.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Thế giới quan thần thoại", "Thế giới quan duy tâm chủ quan", "Thế giới quan duy vật siêu hình"]}, {"id": 138, "q": "Mặt nào sau đây trong quan hệ sản xuất giữ vai trò quyết định?", "letter": "A", "a": "Quan hệ sở hữu đối với tư liệu sản xuất.", "e": "Quan hệ sở hữu đối với tư liệu sản xuất giữ vai trò quyết định đối với quan hệ tổ chức, quản lý sản xuất và quan hệ phân phối sản phẩm, bởi nó xác định địa vị kinh tế của các chủ thể trong quá trình sản xuất.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Quan hệ tổ chức, quản lý sản xuất", "Quan hệ phân phối sản phẩm", "Quan hệ giao tiếp ngoài sản xuất"]}, {"id": 139, "q": "Ph. Ăngghen viết: “...... là điều kiện cơ bản đầu tiên của toàn bộ đời sống loài người, và như thế đến một mức mà trên một ý nghĩa nào đó, chúng ta phải nói: ....... đã sáng tạo ra bản thân con người”. Hãy điền một từ vào chỗ trống để hoàn thiện câu trên.", "letter": "B", "a": "Lao động.", "e": "Lao động đóng vai trò quyết định trong quá trình chuyển biến từ vượn người thành người, thúc đẩy sự phát triển của bộ não, ngôn ngữ, tư duy và ý thức. Lao động cũng là điều kiện cơ bản để duy trì và phát triển đời sống xã hội.", "topic": 1, "type": "Điền khuyết", "wrong": ["Tôn giáo", "Bản năng", "Trí tưởng tượng"]}, {"id": 140, "q": "Phương thức sản xuất bao gồm những yếu tố nào?", "letter": "A", "a": "Lực lượng sản xuất và quan hệ sản xuất.", "e": "Phương thức sản xuất là cách thức con người tiến hành sản xuất vật chất trong những giai đoạn lịch sử nhất định, được hình thành từ sự thống nhất giữa lực lượng sản xuất và quan hệ sản xuất.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Cơ sở hạ tầng và kiến trúc thượng tầng", "Tồn tại xã hội và ý thức xã hội", "Cảm giác và tư duy"]}, {"id": 141, "q": "Nguyên lý cơ bản của phép biện chứng duy vật là nguyên lý nào?", "letter": "D", "a": "Nguyên lý về mối liên hệ phổ biến và về sự phát triển.", "e": "Phép biện chứng duy vật có hai nguyên lý cơ bản. Nguyên lý về mối liên hệ phổ biến khẳng định các sự vật, hiện tượng có sự liên hệ và tác động qua lại. Nguyên lý về sự phát triển khẳng định sự vật luôn vận động và có khuynh hướng phát triển từ thấp đến cao.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Nguyên lý về trạng thái bất biến và cô lập", "Nguyên lý về tính duy nhất của ý thức", "Nguyên lý về tất định chủ quan và ngẫu nhiên tuyệt đối"]}, {"id": 142, "q": "Sự khác biệt cơ bản giữa chủ nghĩa duy tâm chủ quan và chủ nghĩa duy tâm khách quan là gì?", "letter": "D", "a": "Chủ nghĩa duy tâm chủ quan thừa nhận tính thứ nhất của ý thức con người; còn chủ nghĩa duy tâm khách quan coi ý thức là thứ tinh thần khách quan có trước và tồn tại độc lập với con người.", "e": "Cả hai trường phái đều thừa nhận tính thứ nhất của ý thức. Tuy nhiên, chủ nghĩa duy tâm chủ quan đề cao ý thức và cảm giác của cá nhân, còn chủ nghĩa duy tâm khách quan cho rằng có một thực thể tinh thần tồn tại độc lập với con người và quyết định thế giới vật chất.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Cả hai đều khẳng định vật chất có trước ý thức", "Duy tâm khách quan coi cảm giác cá nhân là duy nhất, duy tâm chủ quan coi tinh thần độc lập với con người có trước", "Duy tâm chủ quan và khách quan không có sự khác biệt"]}, {"id": 143, "q": "Cơ sở lý luận của quan điểm lịch sử - cụ thể là:", "letter": "D", "a": "Nguyên lý về mối liên hệ phổ biến.", "e": "Nguyên lý về mối liên hệ phổ biến cho thấy các sự vật, hiện tượng luôn tồn tại trong những mối liên hệ và điều kiện cụ thể. Vì vậy, khi nhận thức và giải quyết vấn đề, cần đặt sự vật trong hoàn cảnh không gian, thời gian và điều kiện lịch sử nhất định.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Nguyên lý về sự phát triển", "Quy luật lượng - chất", "Quy luật phủ định của phủ định"]}, {"id": 144, "q": "Trường phái triết học nào cho vận động là tuyệt đối, đứng im là tương đối?", "letter": "A", "a": "Chủ nghĩa duy vật biện chứng.", "e": "Chủ nghĩa duy vật biện chứng khẳng định vận động là phương thức tồn tại của vật chất, mang tính tuyệt đối. Đứng im chỉ là trạng thái ổn định tương đối, tạm thời của sự vật trong những điều kiện và mối quan hệ nhất định.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Chủ nghĩa duy vật siêu hình", "Chủ nghĩa duy tâm chủ quan", "Quan điểm siêu hình về sự bất biến"]}, {"id": 145, "q": "Căn cứ vào đâu để phân chia giai cấp thành giai cấp cơ bản và giai cấp không cơ bản?", "letter": "A", "a": "Vào phương thức sản xuất mà giai cấp đó đại diện.", "e": "Giai cấp cơ bản là những giai cấp gắn liền với phương thức sản xuất thống trị trong xã hội. Giai cấp không cơ bản là những giai cấp gắn với các phương thức sản xuất khác còn tồn tại trong xã hội.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Vào số lượng thành viên của giai cấp", "Vào địa bàn cư trú", "Vào trình độ học vấn trung bình"]}, {"id": 146, "q": "Đoạn tuyệt triệt để với tham vọng coi triết học là “khoa học của các khoa học”, triết học Mác xác định đối tượng nghiên cứu của mình là gì?", "letter": "C", "a": "Giải quyết mối quan hệ giữa vật chất và ý thức trên lập trường duy vật biện chứng và nghiên cứu những quy luật chung nhất của tự nhiên, xã hội và tư duy.", "e": "Triết học Mác không thay thế các ngành khoa học cụ thể mà nghiên cứu những quy luật vận động, phát triển chung nhất của tự nhiên, xã hội và tư duy, đồng thời cung cấp thế giới quan và phương pháp luận chung cho hoạt động nhận thức và thực tiễn.", "topic": 0, "type": "Kiến thức / lý thuyết", "wrong": ["Nghiên cứu riêng các quy luật vật lý", "Nghiên cứu riêng các hiện tượng tâm lý cá nhân", "Thay thế mọi khoa học cụ thể"]}, {"id": 147, "q": "Bộ phận có quyền lực mạnh nhất trong kiến trúc thượng tầng của xã hội có đối kháng giai cấp là bộ phận nào?", "letter": "B", "a": "Nhà nước.", "e": "Nhà nước là tổ chức quyền lực chính trị đặc biệt, có bộ máy quản lý, hệ thống pháp luật và các công cụ cưỡng chế. Do đó, theo chủ nghĩa duy vật lịch sử, nhà nước là bộ phận có quyền lực mạnh nhất trong kiến trúc thượng tầng của xã hội có đối kháng giai cấp.", "topic": 3, "type": "Kiến thức / lý thuyết", "wrong": ["Tổ chức nghệ thuật", "Tổ chức nghiên cứu khoa học", "Tập quán xã hội"]}, {"id": 148, "q": "Chọn câu trả lời đúng theo quan điểm của triết học Mác - Lênin:", "letter": "B", "a": "Ý thức được hình thành trực tiếp từ lao động.", "e": "Lao động và ngôn ngữ là hai yếu tố cơ bản thuộc nguồn gốc xã hội của ý thức. Thông qua quá trình lao động, con người tác động vào thế giới khách quan, hình thành tri thức, phát triển tư duy và ý thức. Trong các phương án đã cho, B là đáp án phù hợp nhất.", "topic": 1, "type": "Kiến thức / lý thuyết", "wrong": ["Ý thức tồn tại trước vật chất", "Ý thức không có nguồn gốc xã hội", "Ý thức là sự sao chép hoàn toàn thụ động"]}, {"id": 149, "q": "Chủ trương thực hiện nhất quán cơ cấu kinh tế nhiều thành phần ở nước ta hiện nay là:", "letter": "E", "a": "Sự vận dụng đúng đắn quy luật về sự phù hợp của quan hệ sản xuất với trình độ của lực lượng sản xuất.", "e": "Lực lượng sản xuất ở Việt Nam tồn tại ở nhiều trình độ phát triển khác nhau. Vì vậy, việc duy trì nhiều thành phần kinh tế và hình thức sở hữu khác nhau nhằm xây dựng quan hệ sản xuất phù hợp, tạo điều kiện thúc đẩy lực lượng sản xuất phát triển.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["Sự phủ nhận vai trò của lực lượng sản xuất", "Sự tách rời tuyệt đối QHSX khỏi LLSX", "Sự duy trì QHSX bất biến trong mọi điều kiện"]}, {"id": 150, "q": "Nhóm sinh viên được giao chuẩn bị bài thuyết trình về tính độc lập tương đối của ý thức xã hội, một thành viên cho rằng: “Ý thức xã hội phụ thuộc hoàn toàn vào tồn tại xã hội”. Để nhóm đạt kết quả tốt nhất, các thành viên nên làm gì?", "letter": "C", "a": "Cùng phân tích tài liệu và thống nhất rằng ý thức xã hội vừa được quyết định bởi tồn tại xã hội, vừa có tính độc lập tương đối và có thể tác động trở lại tồn tại xã hội.", "e": "Theo chủ nghĩa duy vật lịch sử, tồn tại xã hội quyết định ý thức xã hội, nhưng ý thức xã hội không phụ thuộc một cách thụ động, máy móc vào tồn tại xã hội. Ý thức xã hội có thể lạc hậu, vượt trước, có tính kế thừa và tác động trở lại tồn tại xã hội.", "topic": 3, "type": "Vận dụng / tình huống", "wrong": ["Chấp nhận ý kiến đó mà không cần nghiên cứu", "Khẳng định ý thức xã hội hoàn toàn độc lập với tồn tại xã hội", "Bỏ qua quan hệ giữa tồn tại xã hội và ý thức xã hội"]}];
const topics=['Khái luận về triết học','Chủ nghĩa duy vật biện chứng','Lý luận nhận thức','Chủ nghĩa duy vật lịch sử'];const types=['Kiến thức / lý thuyết','Điền khuyết','Tìm đáp án sai / loại trừ','Vận dụng / tình huống'];const byId=Object.fromEntries(bank.map(q=>[q.id,q]));const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('trietlab:'+k))??d}catch{return d}};const save=(k,v)=>{try{localStorage.setItem('trietlab:'+k,JSON.stringify(v))}catch{}};let history=load('history',{}), session=load('session',null), mode='home';if(session&&(!Array.isArray(session.items)||!session.items.length||session.items.some(x=>!byId[x.id])))session=null;let theme=load('theme',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');function applyTheme(){document.documentElement.dataset.theme=theme;$('#themeBtn').textContent=theme==='dark'?'☀ Sáng':'☾ Tối'}applyTheme();$('#themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';save('theme',theme);applyTheme()};$('#homeBtn').onclick=home;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function persist(){save('session',session);save('history',history)}function tile(n,title,sub,act,kind='number'){return `<button class="tile" data-start="${act}"><span class="${kind}">${esc(n)}</span><strong>${esc(title)}</strong><span>${esc(sub)}</span><span class="arrow">Bắt đầu ↗</span></button>`}function home(){mode='home';$('#homeBtn').hidden=true;const learned=Object.keys(history).length,wrong=Object.keys(history).filter(i=>history[i]===false).length;$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">PHILOSOPHY / PRACTICE ROOM</div><h1>Học triết.<br>Hiểu, không chỉ thuộc.</h1><p>150 câu hỏi Triết học Mác – Lênin. Mỗi lần chọn là một lần hiểu rõ hơn. Luyện theo chủ đề hoặc thử sức với đề ngẫu nhiên.</p></div><div class="art" aria-hidden="true"><svg viewBox="0 0 200 160" fill="none"><circle cx="100" cy="80" r="68" stroke="#bfe99e" stroke-opacity=".35"/><ellipse cx="100" cy="80" rx="38" ry="68" transform="rotate(48 100 80)" stroke="#bfe99e" stroke-width="2"/><ellipse cx="100" cy="80" rx="38" ry="68" transform="rotate(-48 100 80)" stroke="#bfe99e" stroke-width="2"/><circle cx="100" cy="80" r="37" fill="#c7f09f"/><text x="100" y="100" text-anchor="middle" font-family="Georgia,serif" font-size="64" fill="#193f32">φ</text><circle cx="44" cy="37" r="5" fill="#c7f09f"/><circle cx="156" cy="122" r="5" fill="#c7f09f"/></svg></div></section><div class="stats"><div class="stat"><b>150</b><span>Ngân hàng câu hỏi</span></div><div class="stat"><b>${learned}</b><span>Câu đã luyện</span></div><div class="stat"><b>${wrong}</b><span>Câu cần ôn lại</span></div></div>${session&&!session.done?`<div class="resume"><div><strong>Tiếp tục bài đang làm</strong><div class="muted">${esc(session.title)} · ${Object.keys(session.answers).length}/${session.items.length} câu</div></div><button class="primary" id="resume">Tiếp tục →</button></div>`:''}<div class="section-title"><h2>01 / Thử sức ngẫu nhiên</h2><span class="muted">Không lặp câu trong một đề</span></div><div class="tiles">${tile('40','Đề nhanh','40 câu ngẫu nhiên','40')}${tile('80','Đề chuyên sâu','80 câu ngẫu nhiên','80')}${tile('150','Toàn bộ ngân hàng','Luyện hết 150 câu','150')}</div><div class="section-title"><h2>02 / Học theo chủ đề</h2></div><div class="tiles four">${topics.map((t,i)=>tile(['I','II','III','IV'][i],t,bank.filter(q=>q.topic===i).length+' câu','t'+i,'tag')).join('')}</div><div class="section-title"><h2>03 / Luyện theo dạng bài</h2></div><div class="tiles four">${types.map((t,i)=>tile(['≡','…','≠','↗'][i],t,bank.filter(q=>q.type===t).length+' câu','d'+i,'tag')).join('')}</div><div class="section-title"><h2>04 / Củng cố kiến thức</h2></div><div class="resume"><div><strong>Ôn lại câu sai</strong><div class="muted">${wrong} câu có lần trả lời gần nhất chưa đúng.</div></div><button class="primary" id="retryAll" ${wrong?'':'disabled'}>Luyện lại</button></div><div class="notice"><strong>Về bộ đề:</strong> 150 câu hỏi, đáp án đúng và giải thích lấy từ tài liệu Word bạn cung cấp. Các phương án nhiễu được biên soạn bổ sung vì file không có đầy đủ lựa chọn gốc. Vị trí A–D được xáo trộn; chữ cái trong đề gốc được hiển thị riêng. Câu 110 được diễn đạt lại đáp án tổng hợp để phù hợp với lựa chọn mới. Các nhóm chủ đề và dạng bài là phân loại phục vụ luyện tập.</div>`;$('#app').querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>chooseMode(b.dataset.start));if($('#resume'))$('#resume').onclick=()=>quiz();$('#retryAll').onclick=()=>start(bank.filter(q=>history[q.id]===false),'Ôn câu sai');window.scrollTo(0,0)}
function chooseMode(key){if(key[0]==='t')start(bank.filter(q=>q.topic===+key.slice(1)),topics[+key.slice(1)]);else if(key[0]==='d')start(bank.filter(q=>q.type===types[+key.slice(1)]),types[+key.slice(1)]);else start(shuffle(bank).slice(0,+key),key+' câu ngẫu nhiên')}
function start(qs,title){if(!qs.length)return;if(session&&!session.done&&Object.keys(session.answers).length&& !confirm('Bắt đầu đề mới sẽ thay thế bài đang làm. Tiếp tục?'))return;session={title,items:shuffle(qs).map(q=>({id:q.id,options:shuffle([{text:q.display||q.a,correct:true},...q.wrong.map(text=>({text,correct:false}))])})),answers:{},index:0,done:false,started:Date.now()};persist();quiz()}
function counts(){const entries=Object.entries(session.answers);const correct=entries.filter(([idx,opt])=>session.items[idx]?.options[opt]?.correct).length;return {answered:entries.length,correct,wrong:entries.length-correct,left:session.items.length-entries.length}}
function quiz(scroll=true){if(!session)return home();if(session.done)return result();mode='quiz';$('#homeBtn').hidden=false;const i=session.index,it=session.items[i],q=byId[it.id],chosen=session.answers[i],answered=chosen!==undefined,c=counts(),ok=answered&&it.options[chosen].correct;const correctIndex=it.options.findIndex(x=>x.correct);$('#app').innerHTML=`<div class="quiz-layout"><article class="panel"><div class="quiz-meta"><span>${esc(session.title)}</span><span>${c.answered}/${session.items.length} đã trả lời</span></div><div class="bar"><i style="width:${c.answered/session.items.length*100}%"></i></div><div class="pill">Câu ${i+1} / ${session.items.length} · Gốc #${q.id}</div><div class="pill">${esc(q.type)}</div><h1 class="question">${esc(q.q)}</h1><div class="options">${it.options.map((o,j)=>`<button class="option ${answered?(o.correct?'correct':chosen===j?'incorrect':''):''}" data-opt="${j}" ${answered?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span class="ot">${esc(o.text)}</span>${answered&&o.correct?'<b>✓</b>':answered&&chosen===j?'<b>×</b>':''}</button>`).join('')}</div>${answered?`<section class="feedback ${ok?'good':'bad'}" aria-live="polite"><h3 style="color:var(--${ok?'good':'bad'})">${ok?'✓ Chính xác!':'× Chưa chính xác'}</h3><p><strong>Đáp án đúng: ${'ABCD'[correctIndex]}.</strong> ${esc(it.options[correctIndex].text)}</p><p><strong>Giải thích:</strong> ${esc(q.e)}</p><div class="source">Đáp án trong tài liệu gốc: ${esc(q.letter)}. ${esc(q.a)} · Chữ cái trong phần giải thích (nếu có) là của đề gốc.</div></section>`:''}<div class="foot"><button class="ghost" id="prev" ${i===0?'disabled':''}>← Câu trước</button><button class="primary" id="next">${i===session.items.length-1?'Xem kết quả →':answered?'Câu tiếp theo →':'Bỏ qua →'}</button></div><div class="key">Phím tắt: 1–4 / A–D chọn đáp án · ← → chuyển câu · Enter tiếp tục</div></article><aside class="panel sidebar"><div class="side-head"><h3>Tiến độ bài làm</h3><span class="muted">${Math.round(c.answered/session.items.length*100)}%</span></div><div class="score-row"><div><b class="green">${c.correct}</b>Đúng</div><div><b class="red">${c.wrong}</b>Sai</div><div><b>${c.left}</b>Chưa làm</div></div><div class="nums">${session.items.map((it,j)=>`<button class="num ${session.answers[j]!==undefined?(it.options[session.answers[j]].correct?'good':'bad'):''} ${j===i?'current':''}" data-jump="${j}" aria-label="Câu ${j+1}">${j+1}</button>`).join('')}</div><p class="legend">Màu xanh: đúng · Đỏ: sai · Viền: đang xem</p><button class="subtle" id="finish" style="width:100%;margin-top:12px">Kết thúc bài</button></aside></div>`;$('#app').querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answer(+b.dataset.opt));$('#app').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>go(+b.dataset.jump));$('#prev').onclick=()=>go(i-1);$('#next').onclick=next;$('#finish').onclick=finish;if(scroll)window.scrollTo(0,0)}
function answer(j){if(mode!=='quiz'||session.answers[session.index]!==undefined)return;let i=session.index,it=session.items[i];if(!it.options[j])return;session.answers[i]=j;history[it.id]=it.options[j].correct;persist();quiz(false);if(innerWidth<650)document.querySelector('.feedback')?.scrollIntoView({behavior:'smooth',block:'nearest'})}function go(i){if(i<0||i>=session.items.length)return;session.index=i;persist();quiz()}function next(){if(session.index<session.items.length-1)go(session.index+1);else finish()}function finish(){const c=counts();if(c.left&&!confirm(`Còn ${c.left} câu chưa trả lời. Bạn muốn kết thúc bài?`))return;session.done=true;persist();result()}
function result(){mode='result';$('#homeBtn').hidden=false;const c=counts(),total=session.items.length,pct=Math.round(c.correct/total*100);const incorrect=session.items.filter((it,i)=>session.answers[i]!==undefined&&!it.options[session.answers[i]].correct).map(it=>byId[it.id]);$('#app').innerHTML=`<section class="panel result"><div class="result-top"><div class="eyebrow muted">KẾT QUẢ LUYỆN TẬP</div><h1>${pct>=80?'Làm tốt lắm!':pct>=50?'Đang tiến bộ!':'Tiếp tục luyện tập nhé!'}</h1><div class="big">${pct}%</div><p>${c.correct}/${total} câu đúng · ${esc(session.title)}</p><div class="bar"><i style="width:${pct}%"></i></div><div class="score-row"><div><b class="green">${c.correct}</b>Đúng</div><div><b class="red">${c.wrong}</b>Sai</div><div><b>${c.left}</b>Chưa làm</div></div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="primary" id="redo" ${incorrect.length?'':'disabled'}>Luyện lại ${incorrect.length} câu sai</button><button class="ghost" id="back">Trang chủ</button></div></div><h2 style="font-size:18px">Xem lại bài làm</h2>${session.items.map((it,i)=>{const q=byId[it.id],choice=session.answers[i],right=it.options.find(x=>x.correct),ok=choice!==undefined&&it.options[choice].correct;return `<details class="review-item" ${i===0?'open':''}><summary>${choice===undefined?'○':ok?'✓':'×'} Câu ${i+1} · ${esc(q.q)}</summary><p class="${ok?'right':'wrong'}">Bạn chọn: ${choice===undefined?'Chưa trả lời':esc(it.options[choice].text)}</p><p class="right"><b>Đáp án:</b> ${esc(right.text)}</p><p>${esc(q.e)}</p><p class="muted">Câu gốc ${q.id} · Đáp án gốc ${q.letter}</p></details>`}).join('')}</section>`;$('#redo').onclick=()=>start(incorrect,'Luyện lại câu sai');$('#back').onclick=home;window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(mode!=='quiz'||e.altKey||e.ctrlKey||e.metaKey||e.repeat||e.target.matches('input,select,textarea,button'))return;let k=e.key.toLowerCase(),j='abcd'.indexOf(k);if(k.length===1&&j>=0){e.preventDefault();answer(j)}else if(/^[1-4]$/.test(k)){e.preventDefault();answer(+k-1)}else if(k==='arrowleft'){e.preventDefault();go(session.index-1)}else if(k==='arrowright'||k==='enter'){e.preventDefault();next()}});home();
</script></body></html>
